<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FirePath — Ask FirePath</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/visual-system.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --fire-orange: #F4622A; --fire-amber: #F9A825; --warm-cream: #FDF6EE;
    --warm-brown: #3D2B1F; --soft-grey: #9E8E85; --border: #EDE3DA;
  }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif; background: var(--warm-cream); color: var(--warm-brown);
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }

  /* ── A real chat shell: header + scrolling thread + fixed input bar, not a form
       with a single answer block appended below it. Constrained to a phone-ish
       column even at wider viewports — this page doesn't have the rail-based
       desktop treatment the other pages do yet, so it just stays centred and
       readable rather than stretching full-bleed. ── */
  .chat-page { display: flex; flex-direction: column; height: 100dvh; max-width: 640px; margin: 0 auto; }

  .chat-header {
    flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
    padding: max(22px, env(safe-area-inset-top)) 22px 16px; border-bottom: 1px solid var(--border);
  }
  .chat-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 22px; margin-bottom: 4px; }
  .chat-sub { font-size: 13px; color: var(--soft-grey); font-weight: 300; line-height: 1.4; max-width: 36ch; }
  .chat-close {
    flex-shrink: 0; width: 34px; height: 34px; margin-top: 2px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--warm-brown); text-decoration: none; opacity: 0.5; transition: opacity 0.2s ease, background 0.2s ease;
  }
  .chat-close:hover { opacity: 0.9; background: rgba(61,43,31,0.06); }

  .chat-thread {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 18px 20px 14px; display: flex; flex-direction: column; gap: 16px;
  }

  .chat-starters-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fire-orange); margin-bottom: 10px; }
  .chat-starters { display: flex; flex-direction: column; gap: 8px; }

  .pill-chip {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 8px;
    text-align: left; background: white; border: 1.5px solid var(--border);
    border-radius: 20px; padding: 9px 16px 9px 12px; font-size: 13px; font-weight: 500; color: var(--warm-brown);
    cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease;
  }
  .pill-chip:hover { border-color: var(--fire-orange); background: rgba(244,98,42,0.04); }
  .pill-chip-icon {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: rgba(244,98,42,0.12); color: var(--fire-orange);
    display: flex; align-items: center; justify-content: center;
  }

  /* One turn = the user's bubble plus FirePath's card reply, kept together so the
     thread reads as a conversation rather than a stack of disconnected cards. */
  .chat-turn { display: flex; flex-direction: column; gap: 10px; }
  .chat-bubble-user {
    align-self: flex-end; max-width: 82%; background: var(--fire-orange); border: 1px solid var(--fire-orange);
    border-radius: 18px 18px 4px 18px; padding: 11px 16px; font-size: 14px; font-weight: 500;
    color: white; line-height: 1.4;
  }

  /* ── Reply cards — three distinct visual tones for the three answer tiers, so the
       difference between "here's a real answer" and "we can't do that yet" is felt,
       not just read. Same classification logic as before this pass, only how it's
       presented (a chat card instead of the page's single response block) changed. ── */
  .chat-card { border-radius: 18px; padding: 18px 18px; }
  .chat-card-supported { background: white; border: 1.5px solid var(--border); box-shadow: 0 8px 24px rgba(61,43,31,0.06); }
  .chat-card-guided { background: linear-gradient(135deg, #FFF7F3, #FFFBF7); border: 1px solid rgba(244,98,42,0.15); }
  .chat-card-unsupported { background: white; border: 1px dashed var(--border); }
  .chat-tag {
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    margin-bottom: 10px; display: inline-block; padding: 3px 9px; border-radius: 20px;
  }
  .chat-card-supported .chat-tag { color: #2E7D32; background: rgba(46,125,50,0.1); }
  .chat-card-guided .chat-tag { color: var(--fire-orange); background: rgba(244,98,42,0.1); }
  .chat-card-unsupported .chat-tag { color: var(--soft-grey); background: rgba(158,142,133,0.1); }
  .chat-headline { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; color: var(--warm-brown); line-height: 1.35; margin-bottom: 8px; }
  .chat-body { font-size: 13.5px; color: var(--soft-grey); font-weight: 300; line-height: 1.6; margin-bottom: 12px; }
  /* The little "what it would take" stat callout from the mockup's retire-age
     answer — a real number pulled out of the paragraph above it, not a chart
     (that would need its own render pass this pass didn't budget for). */
  .chat-stat-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--warm-cream); border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 14px; margin-bottom: 12px;
  }
  .chat-stat-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 13.5px; color: var(--warm-brown); }
  .chat-stat-label { font-size: 11px; color: var(--soft-grey); margin-top: 1px; }
  .chat-stat-value { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 14px; color: var(--fire-orange); text-align: right; flex-shrink: 0; }
  .chat-learn-link {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--warm-cream); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; text-decoration: none; font-size: 13px; color: var(--warm-brown); font-weight: 500;
  }
  .chat-learn-link:hover { border-color: var(--fire-orange); }
  .chat-followups { display: flex; flex-wrap: wrap; gap: 8px; }
  .chat-followups .pill-chip { align-self: auto; }

  .chat-input-bar {
    flex-shrink: 0; display: flex; align-items: flex-end; gap: 10px;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: rgba(253,246,238,0.96); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .chat-input {
    flex: 1; border: 1.5px solid var(--border); border-radius: 22px; background: white;
    padding: 12px 16px; font-family: 'DM Sans', sans-serif; font-size: 14.5px; color: var(--warm-brown);
    resize: none; min-height: 22px; max-height: 100px; line-height: 1.4;
  }
  .chat-input:focus { outline: none; border-color: var(--fire-orange); }
  .chat-input::placeholder { color: var(--soft-grey); font-weight: 300; }
  .chat-send {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--fire-orange), var(--fire-amber)); border: none;
    color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: opacity 0.15s ease;
  }
  .chat-send:disabled { opacity: 0.4; cursor: default; }
</style>
<script src="js/interactions.js"></script>
</head>
<body>
<div class="chat-page">

  <header class="chat-header">
    <div>
      <div class="chat-title">Ask FirePath</div>
      <div class="chat-sub">Your AI copilot for smarter financial decisions.</div>
    </div>
    <a href="journey.html" class="chat-close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </a>
  </header>

  <div class="chat-thread" id="chatThread">
    <div class="chat-starters" id="chatStarters">
      <div class="chat-starters-label">Popular questions</div>
      <button class="pill-chip" data-q="What if I save an extra $250 a month?"><span class="pill-chip-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></span>What if I save an extra $250 a month?</button>
      <button class="pill-chip" data-q="What if I spend $150 less a week?"><span class="pill-chip-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></span>What if I spend $150 less a week?</button>
      <button class="pill-chip" data-q="What if I retire at 40?"><span class="pill-chip-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></span>What if I retire at 40?</button>
      <button class="pill-chip" data-q="What if I sell my investment property?"><span class="pill-chip-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></span>What if I sell my investment property?</button>
    </div>
  </div>

  <div class="chat-input-bar">
    <textarea class="chat-input" id="askInput" rows="1" placeholder="Ask anything about your plan…"></textarea>
    <button class="chat-send" id="askSubmit" aria-label="Send" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>

</div>

<script>
  // Baseline — the same numbers used consistently across every FirePath example
  // tonight ($520k portfolio, $2,600/mo savings, $65k spend, age 35). Kept identical
  // on purpose so this page's answers stay internally consistent with everything else.
  const BASELINE = { portfolio: 520000, monthlySavings: 2600, annualSpend: 65000, age: 35 };

  function solveMonthsToTarget(startPortfolio, monthlySavings, targetSpend, rate) {
    rate = rate == null ? 0.07 : rate;
    const r = rate / 12;
    let portfolio = startPortfolio;
    for (let m = 0; m <= 40 * 12; m++) {
      if (portfolio * 0.04 >= targetSpend) return m;
      portfolio = portfolio * (1 + r) + monthlySavings;
    }
    return null;
  }
  function projectPortfolio(startPortfolio, monthlySavings, years, rate) {
    rate = rate == null ? 0.07 : rate;
    const r = rate / 12;
    let portfolio = startPortfolio;
    for (let m = 0; m < Math.round(years * 12); m++) portfolio = portfolio * (1 + r) + monthlySavings;
    return portfolio;
  }
  function fmtM(n) { return '$' + Math.round(n).toLocaleString('en-AU'); }

  const baselineMonths = solveMonthsToTarget(BASELINE.portfolio, BASELINE.monthlySavings, BASELINE.annualSpend);

  // ── Classification — three tiers, matching the boundary already agreed: does a
  //    validated calculation exist for this question, not just "do we have data." ──
  const GUIDED_KEYWORDS = [
    { pattern: /propert(y|ies)|sell.*(house|home)|downsiz/i, name: 'selling or downsizing property', why: 'it requires modelling capital gains tax, selling costs, and reinvestment assumptions' },
    { pattern: /redundan|payout|severance/i, name: 'a redundancy payout', why: 'it requires modelling how a lump sum interacts with tax, timing, and your ongoing income' },
    { pattern: /child|kids?|baby|pregnan/i, name: 'having a child', why: 'it requires modelling cost-of-living changes and government payments like Family Tax Benefit' },
    { pattern: /inherit/i, name: 'an inheritance', why: 'it requires modelling how a lump sum changes your timeline alongside your existing plan' },
  ];

  function classifyAndAnswer(question) {
    const q = question.toLowerCase();

    // Guided tier — honest, specific reason, not a generic failure
    for (const g of GUIDED_KEYWORDS) {
      if (g.pattern.test(q)) {
        return { tier: 'guided', name: g.name, why: g.why };
      }
    }

    // Supported tier — savings increase
    let m = q.match(/save.*?\$?(\d[\d,]*)\s*(a|per)?\s*(week|fortnight|month)/);
    if (m) {
      let amount = parseFloat(m[1].replace(/,/g, ''));
      const unit = m[3];
      const extraMonthly = unit === 'week' ? amount * 52 / 12 : unit === 'fortnight' ? amount * 26 / 12 : amount;
      const newMonths = solveMonthsToTarget(BASELINE.portfolio, BASELINE.monthlySavings + extraMonthly, BASELINE.annualSpend);
      const movedBy = baselineMonths - newMonths;
      return { tier: 'supported', type: 'savings', extraMonthly, movedBy, newMonths };
    }

    // Supported tier — spending decrease
    m = q.match(/spend.*?\$?(\d[\d,]*)\s*less\s*(a|per)?\s*(week|fortnight|month)/);
    if (m) {
      let amount = parseFloat(m[1].replace(/,/g, ''));
      const unit = m[3];
      const extraMonthly = unit === 'week' ? amount * 52 / 12 : unit === 'fortnight' ? amount * 26 / 12 : amount;
      const newAnnualSpend = Math.max(0, BASELINE.annualSpend - extraMonthly * 12);
      const newMonths = solveMonthsToTarget(BASELINE.portfolio, BASELINE.monthlySavings + extraMonthly, newAnnualSpend);
      const movedBy = baselineMonths - newMonths;
      return { tier: 'supported', type: 'spending', extraMonthly, movedBy, newMonths };
    }

    // Supported tier — retirement age target
    m = q.match(/retire.*?(\d{2})|(\d{2}).*?(retire|retirement)/);
    if (m) {
      const targetAge = parseInt(m[1] || m[2], 10);
      const yearsToTarget = targetAge - BASELINE.age;
      if (yearsToTarget <= 0) return { tier: 'unsupported' };
      const projected = projectPortfolio(BASELINE.portfolio, BASELINE.monthlySavings, yearsToTarget);
      const income = projected * 0.04;
      const gap = BASELINE.annualSpend - income;
      return { tier: 'supported', type: 'retireAge', targetAge, yearsToTarget, projected, income, gap };
    }

    return { tier: 'unsupported' };
  }

  // Escapes user-typed text before it goes into innerHTML — the question itself is
  // arbitrary input rendered straight into the thread, so this closes a real (if
  // minor, single-user) XSS gap the previous version had.
  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function buildCardHtml(result) {
    if (result.tier === 'supported') {
      let headline = '', body = '', statHtml = '';
      const LEARN_TOPICS = {
        savings: { title: 'The power of compounding', topic: 'compounding' },
        spending: { title: 'The real impact of annual spending', topic: 'spending' },
        retireAge: { title: 'How safe withdrawal rates work', topic: 'four-percent' },
      };
      if (result.type === 'savings') {
        const years = Math.floor(result.movedBy / 12), months = Math.round(result.movedBy % 12);
        headline = result.movedBy > 0
          ? `That moves your freedom date <strong>${years > 0 ? years + ' years, ' : ''}${months} months closer</strong>.`
          : `That change is too small to move your freedom date meaningfully.`;
        body = `Saving an extra ${fmtM(result.extraMonthly)} a month, on top of what you're already putting away, brings your projected time to freedom down to about ${(result.newMonths / 12).toFixed(1)} years.`;
      } else if (result.type === 'spending') {
        const years = Math.floor(result.movedBy / 12), months = Math.round(result.movedBy % 12);
        headline = `That moves your freedom date <strong>${years > 0 ? years + ' years, ' : ''}${months} months closer</strong>.`;
        body = `Spending less both reduces what you need to fund in retirement and frees up more to save today — a double effect, which is why it moves the date further than an equivalent savings increase.`;
      } else if (result.type === 'retireAge') {
        const shortfall = result.gap > 0;
        if (shortfall) {
          headline = `At age ${result.targetAge}, your portfolio would fall short by about <strong>${fmtM(result.gap)} a year</strong>.`;
          body = `Projecting your current savings forward ${result.yearsToTarget} years gets you to roughly ${fmtM(result.projected)} — enough to fund ${fmtM(result.income)} a year at a 4% withdrawal rate, against ${fmtM(BASELINE.annualSpend)} you'd actually need.`;
        } else {
          headline = `Age ${result.targetAge} looks achievable on your current numbers.`;
          body = `Projecting forward ${result.yearsToTarget} years puts your portfolio around ${fmtM(result.projected)} — comfortably covering ${fmtM(BASELINE.annualSpend)} a year at a 4% withdrawal rate.`;
        }
        // The mockup's "what it would take" stat callout — a real number pulled out
        // of the paragraph above, not a chart (no render pass built for that yet).
        statHtml = `
          <div class="chat-stat-row">
            <div>
              <div class="chat-stat-title">Retire at ${result.targetAge}</div>
              <div class="chat-stat-label">What it would take</div>
            </div>
            <div class="chat-stat-value">${shortfall ? 'Shortfall' : 'Buffer'} ${fmtM(Math.abs(result.gap))}</div>
          </div>`;
      }
      const learn = LEARN_TOPICS[result.type];
      return `
        <div class="chat-card chat-card-supported">
          <span class="chat-tag">✓ Calculated from your saved financial profile</span>
          <div class="chat-headline">${headline}</div>
          <div class="chat-body">${body}</div>
          ${statHtml}
          <a href="learning_lab.html?topic=${learn.topic}" class="chat-learn-link">
            <span>Worth exploring: ${learn.title}</span>
            <span>→</span>
          </a>
        </div>`;
    } else if (result.tier === 'guided') {
      return `
        <div class="chat-card chat-card-guided">
          <span class="chat-tag">Can't calculate this accurately yet</span>
          <div class="chat-headline">FirePath can't accurately calculate ${result.name} yet.</div>
          <div class="chat-body">That's because ${result.why}. This is a scenario we're planning to support — for now, the Scenario Explorer has a curated walkthrough for some decisions like this.</div>
          <a href="hearmeout.html" class="chat-learn-link">
            <span>Browse Scenario Explorer</span>
            <span>→</span>
          </a>
        </div>`;
    }
    return `
      <div class="chat-card chat-card-unsupported">
        <span class="chat-tag">Can't answer this yet</span>
        <div class="chat-headline">I'm not able to model that accurately from what you've asked.</div>
        <div class="chat-body">Try asking about a specific savings amount, spending change, or retirement age — those are the questions FirePath can calculate precisely today.</div>
      </div>`;
  }

  // Offers question TYPES different from the one just answered, so tapping through
  // a thread feels like exploring different levers, not repeating the same one.
  function buildFollowupsHtml(result) {
    if (result.tier !== 'supported') return '';
    const FOLLOW_UPS = {
      savings: ['What if I spend $100 less a week?', 'What if I retire at 45?'],
      spending: ['What if I save an extra $300 a month?', 'What if I retire at 50?'],
      retireAge: ['What if I save an extra $250 a month?', 'What if I spend $150 less a week?'],
    };
    const suggestions = FOLLOW_UPS[result.type] || [];
    if (!suggestions.length) return '';
    const chipIcon = '<span class="pill-chip-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></span>';
    return `<div class="chat-followups">${suggestions.map(s => `<button class="pill-chip" data-q="${escapeHtml(s)}">${chipIcon}${escapeHtml(s)}</button>`).join('')}</div>`;
  }

  // One turn = the user's bubble plus FirePath's card reply, appended to the thread
  // and scrolled into view — this is the whole "messaging interface" behavior: every
  // question becomes a new turn instead of replacing a single answer block in place.
  function appendTurn(question, result) {
    const thread = document.getElementById('chatThread');
    const starters = document.getElementById('chatStarters');
    if (starters) starters.remove();

    const turn = document.createElement('div');
    turn.className = 'chat-turn';
    turn.innerHTML = `
      <div class="chat-bubble-user">${escapeHtml(question)}</div>
      ${buildCardHtml(result)}
      ${buildFollowupsHtml(result)}
    `;
    thread.appendChild(turn);
    wireChips(turn);
    thread.scrollTop = thread.scrollHeight;
  }

  function wireChips(scopeEl) {
    scopeEl.querySelectorAll('.pill-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const q = chip.dataset.q;
        appendTurn(q, classifyAndAnswer(q));
      });
    });
  }

  wireChips(document.getElementById('chatStarters'));

  const askInput = document.getElementById('askInput');
  const askSubmit = document.getElementById('askSubmit');

  function autoGrow() {
    askInput.style.height = 'auto';
    askInput.style.height = Math.min(askInput.scrollHeight, 100) + 'px';
  }
  function submitQuestion() {
    const q = askInput.value.trim();
    if (!q) return;
    appendTurn(q, classifyAndAnswer(q));
    askInput.value = '';
    askSubmit.disabled = true;
    autoGrow();
  }
  askInput.addEventListener('input', () => {
    askSubmit.disabled = askInput.value.trim().length === 0;
    autoGrow();
  });
  // Enter sends, Shift+Enter still makes a new line — standard messaging-app behavior.
  askInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuestion(); }
  });
  askSubmit.addEventListener('click', submitQuestion);

  // Deep-linked from Learning Lab's search ("Ask FirePath about '{query}'") — opens
  // straight into a turn instead of leaving the thread empty.
  const deepLinkQ = new URLSearchParams(window.location.search).get('q');
  if (deepLinkQ) appendTurn(deepLinkQ, classifyAndAnswer(deepLinkQ));
</script>
</body>
</html>
