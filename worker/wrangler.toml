# FirePath API Worker — deploy with:  cd worker && npx wrangler deploy
# Secrets live in Cloudflare (dashboard → Workers → firepath-api → Settings →
# Variables and Secrets), never in this repo. See the header of src/index.js.

name = "firepath-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
# No per-version preview URLs — the API is only reachable at its one address.
preview_urls = false

# Keep the variables already configured in the dashboard on every deploy —
# without this, `wrangler deploy` would remove any not listed here.
keep_vars = true

# Rate limiting: a Durable Object keeps exact per-minute and per-day counts
# (AI: 10/min + 100/day per user; feedback: 3/min + 20/day per connection).
# Limits live in RATE_LIMITS in src/index.js. Durable Objects work on the free plan.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[observability]
enabled = true
