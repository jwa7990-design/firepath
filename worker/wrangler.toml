# FirePath API Worker — deploy with:  cd worker && npx wrangler deploy
# Secrets live in Cloudflare (dashboard → Workers → firepath-api → Settings →
# Variables and Secrets), never in this repo. See the header of src/index.js.

name = "firepath-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
# No per-version preview URLs — the API is only reachable at its one address.
preview_urls = false

# Keep the variables already configured in the dashboard on every deploy —
# without this, `wrangler deploy` would remove any not listed here.
keep_vars = true

# Rate limiting: a Durable Object keeps exact counts per key
# (AI: 10/min, 30/day, 300/30 days per user + 2,000/day for everyone;
#  sign-in/sign-up/reset: 10/min + 50/hour per connection, 5/hour per email;
#  feedback: 3/min + 20/day per connection).
# Limits live in RATE_LIMITS in src/index.js. Durable Objects work on the free plan.
# No new migration needed: same RateLimiter class, just new keys.
#
# Optional plain variable PREVIEW_ORIGINS (comma-separated https addresses) lets a
# Pages preview call the API — set it in the dashboard; see the top of src/index.js.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Health checks: every 30 minutes, scheduled() in src/index.js checks the website,
# Supabase and Stripe, and emails the owner if one fails twice in a row (and again
# when it recovers). Its state is kept in the same RateLimiter Durable Object
# (instance "health:state"), so no migration or KV is needed. Cron Triggers are free.
# To pause: comment out the crons line and deploy (or Dashboard → firepath-api →
# Settings → Trigger events → delete the cron).
[triggers]
crons = ["*/30 * * * *"]

# Plain (non-secret) settings live here so every deploy matches the dashboard.
#   CUSTOMER_EMAILS = "on"   → sends customers the Pro welcome and trial-ending emails
#   SUPPORT_EMAIL            → Reply-To address on customer emails
#   PREVIEW_ORIGINS          → optional, comma-separated preview addresses allowed to
#                              call the API (add here, or in the dashboard while testing)
[vars]
CUSTOMER_EMAILS = "on"
SUPPORT_EMAIL = "hello@firepath.pro"

[observability]
enabled = true
