<!DOCTYPE html>
<html lang="en">
<head>
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q2QZ662MJ9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>FirePath — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
  <script src="js/persona.js"></script>
<style>
  .auth-main { min-height: calc(100vh - var(--nav-h)); min-height: calc(100dvh - var(--nav-h)); display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px calc(48px + env(safe-area-inset-bottom)); }
  @media (min-width: 768px) { .auth-main { align-items: center; padding: 48px 32px 96px; } }
  .auth-wrap { width: 100%; max-width: 420px; }
  .auth-card { padding: 24px 20px 28px; }
  @media (min-width: 768px) { .auth-card { padding: 32px 32px 36px; } }

  .tabs { display: flex; padding: 3px; gap: 2px; margin-bottom: 28px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
  .tab { flex: 1; height: 38px; border: none; background: none; border-radius: 999px; font: 500 13.5px var(--font-ui); color: var(--ink-2); cursor: pointer; transition: background var(--dur-fast) ease, color var(--dur-fast) ease, box-shadow var(--dur-fast) ease; }
  .tab:hover { color: var(--ink); }
  .tab.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }
  .tab:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

  .card-title { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.2; letter-spacing: -0.01em; color: var(--ink); }
  .card-sub { font-size: 14.5px; color: var(--ink-2); line-height: 1.55; margin: 6px 0 24px; }

  .input-group { display: grid; gap: 6px; margin-bottom: 16px; }
  .input-label { font-size: 13.5px; font-weight: 500; color: var(--ink); }
  .input-wrapper-pass { position: relative; }
  .input-wrapper-pass input { padding-right: 48px; }
  .eye-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; background: none; border: none; border-radius: 50%; cursor: pointer; color: var(--ink-3); display: flex; align-items: center; justify-content: center; }
  .eye-btn:hover { color: var(--ink); background: var(--surface-2); }

  .cta-btn { margin-top: 8px; }
  .cta-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .auth-forgot { text-align: center; margin-top: 14px; }
  .auth-forgot a { font-size: 13.5px; font-weight: 500; color: var(--ember-ink); text-decoration: none; }
  .auth-forgot a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .error-msg { display: none; margin-top: 14px; padding: 10px 14px; border-radius: var(--r-sm); background: var(--negative-wash); color: var(--negative); font-size: 13.5px; line-height: 1.5; }
  .success-msg { display: none; margin-top: 14px; padding: 10px 14px; border-radius: var(--r-sm); background: var(--positive-wash); color: var(--positive); font-size: 13.5px; line-height: 1.5; }

  .back-link { text-align: center; margin-top: 20px; }
  .back-link a { font-size: 13.5px; color: var(--ink-2); text-decoration: none; }
  .back-link a:hover { color: var(--ink); }
</style>
</head>
<body class="site" data-shell="site" data-footer="none">
<script src="js/shell.js"></script>

<main class="auth-main">
<div class="auth-wrap">

  <div class="card auth-card">
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" id="loginTab" onclick="showTab('login')">Sign in</button>
      <button type="button" class="tab" id="signupTab" onclick="showTab('signup')">Create account</button>
    </div>

    <!-- Login -->
    <div id="loginForm">
      <h1 class="card-title">Welcome back</h1>
      <p class="card-sub">Sign in to see your freedom date and track your progress.</p>
      <div class="input-group">
        <label class="input-label" for="loginEmail">Email</label>
        <input class="input" type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="input-group">
        <label class="input-label" for="loginPassword">Password</label>
        <div class="input-wrapper-pass">
          <input class="input" type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"/>
          <button type="button" class="eye-btn" onclick="toggleEye('loginPassword', this)" tabindex="-1" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button class="btn btn-primary btn-lg btn-block cta-btn" id="loginBtn" onclick="login()">Sign in →</button>
      <div class="auth-forgot">
        <a href="#" onclick="forgotPassword(event)">Forgot password?</a>
      </div>
      <p class="error-msg" id="loginError"></p>
    </div>

    <!-- Signup -->
    <div id="signupForm" style="display:none">
      <h1 class="card-title">Create your account</h1>
      <p class="card-sub">Free to start. Your data stays private and secure.</p>
      <div class="input-group">
        <label class="input-label" for="signupEmail">Email</label>
        <input class="input" type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="input-group">
        <label class="input-label" for="signupPassword">Password</label>
        <div class="input-wrapper-pass">
          <input class="input" type="password" id="signupPassword" placeholder="At least 8 characters" autocomplete="new-password"/>
          <button type="button" class="eye-btn" onclick="toggleEye('signupPassword', this)" tabindex="-1" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button class="btn btn-primary btn-lg btn-block cta-btn" id="signupBtn" onclick="signup()">Create account →</button>
      <p class="error-msg" id="signupError"></p>
      <p class="success-msg" id="signupSuccess">Check your email to confirm your account!</p>
    </div>

    <!-- Reset Password -->
    <div id="resetForm" style="display:none">
      <h1 class="card-title">Set new password</h1>
      <p class="card-sub">Choose a new password for your FirePath account.</p>
      <div class="input-group">
        <label class="input-label" for="resetPassword">New password</label>
        <div class="input-wrapper-pass">
          <input class="input" type="password" id="resetPassword" placeholder="Choose a strong password" autocomplete="new-password"/>
          <button type="button" class="eye-btn" onclick="toggleEye('resetPassword', this)" tabindex="-1" aria-label="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button class="btn btn-primary btn-lg btn-block cta-btn" id="resetBtn" onclick="saveNewPassword()">Save new password →</button>
      <p class="error-msg" id="resetError"></p>
    </div>

  </div>

  <div class="back-link">
    <a href="index.html">← Back to FirePath</a>
  </div>

</div>
</main>
<script>
  const WORKER_URL = 'https://firepath-api.jwa7990.workers.dev';
  const SUPABASE_URL = 'https://eeicdaxfrahzgjywrlgs.supabase.co';

  function setStore(key, value) {
    try { localStorage.setItem(key, value); } catch(e) { sessionStorage.setItem(key, value); }
  }
  function getStore(key) {
    try { const v = localStorage.getItem(key); if (v) return v; } catch(e) {}
    return sessionStorage.getItem(key);
  }
  function removeStore(key) {
    try { localStorage.removeItem(key); } catch(e) {}
    try { sessionStorage.removeItem(key); } catch(e) {}
  }

  const EYE_OPEN_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>`;
  const EYE_CLOSED_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>`;
  function toggleEye(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') { input.type = 'text'; btn.innerHTML = EYE_CLOSED_SVG; }
    else { input.type = 'password'; btn.innerHTML = EYE_OPEN_SVG; }
  }

  function showTab(tab) {
    document.getElementById('loginTab').classList.toggle('active', tab === 'login');
    document.getElementById('signupTab').classList.toggle('active', tab === 'signup');
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
  }

  async function login() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginError');
    if (!email || !password) { showError(err, 'Please enter your email and password.'); return; }
    btn.disabled = true; btn.textContent = 'Signing in...'; err.style.display = 'none';
    try {
      const res = await fetch(`${WORKER_URL}/auth/token?grant_type=password`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.error) { showError(err, data.error_description || 'Invalid email or password.'); btn.disabled = false; btn.textContent = 'Sign in →'; return; }
      setStore('fp_access_token', data.access_token);
      setStore('fp_user_id', data.user.id);
      setStore('fp_email', data.user.email);
      const persona = await getUserPersona(data.user.id, data.access_token);
      if (persona) setStore('fp_persona', persona);
      window.location.href = landingUrl();
    } catch(e) { showError(err, 'Something went wrong. Please try again.'); btn.disabled = false; btn.textContent = 'Sign in →'; }
  }

  async function signup() {
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const btn = document.getElementById('signupBtn');
    const err = document.getElementById('signupError');
    const success = document.getElementById('signupSuccess');
    if (!email || !password) { showError(err, 'Please enter your email and password.'); return; }
    if (password.length < 8) { showError(err, 'Password must be at least 8 characters.'); return; }
    btn.disabled = true; btn.textContent = 'Creating account...'; err.style.display = 'none';
    try {
      const res = await fetch(`${WORKER_URL}/auth/signup`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.error) { showError(err, data.msg || data.error || 'Could not create account.'); btn.disabled = false; btn.textContent = 'Create account →'; return; }
      success.style.display = 'block'; btn.textContent = 'Check your email';
    } catch(e) { showError(err, 'Something went wrong. Please try again.'); btn.disabled = false; btn.textContent = 'Create account →'; }
  }

  // Signed-in landing: each persona has its own starting page; anyone who hasn't
  // picked one yet goes to the welcome page first.
  function landingUrl() {
    return FirePathPersona.hasChosen() ? FirePathPersona.startUrl() : 'welcome.html';
  }

  async function getUserPersona(userId, token) {
    try {
      const res = await fetch(`${WORKER_URL}/db/users?id=eq.${userId}&select=persona`, { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();
      return data[0]?.persona || null;
    } catch { return null; }
  }

  async function forgotPassword(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const err = document.getElementById('loginError');
    if (!email) { showError(err, 'Enter your email address first.'); return; }
    try {
      await fetch(`${WORKER_URL}/auth/recover`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, redirectTo: 'https://firepath.pro/auth.html' })
      });
      err.style.display = 'none';
      alert('Password reset email sent — check your inbox.');
    } catch(e) { showError(err, 'Something went wrong. Please try again.'); }
  }

  async function saveNewPassword() {
    const password = document.getElementById('resetPassword').value;
    const err = document.getElementById('resetError');
    if (password.length < 8) { showError(err, 'Password must be at least 8 characters.'); return; }
    const btn = document.getElementById('resetBtn');
    btn.disabled = true; btn.textContent = 'Saving...';

    try {
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const token = hashParams.get('access_token');

      if (!token) {
        showError(err, 'Session expired. Please request a new password reset email.');
        btn.disabled = false; btn.textContent = 'Save new password →';
        return;
      }

      const res = await fetch(`${WORKER_URL}/auth/user`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
        },
        body: JSON.stringify({ password })
      });

      const data = await res.json();
      console.log('Reset response:', data);

      if (data.error || !data.id) {
        showError(err, data.msg || data.error_description || data.error || 'Something went wrong.');
        btn.disabled = false; btn.textContent = 'Save new password →';
        return;
      }

      setStore('fp_access_token', token);
      setStore('fp_user_id', data.id);
      setStore('fp_email', data.email);

      alert('Password updated! Signing you in...');
      window.location.href = landingUrl();

    } catch(e) {
      console.error(e);
      showError(err, 'Something went wrong. Please try again.');
      btn.disabled = false; btn.textContent = 'Save new password →';
    }
  }

  function continueAsGuest() {
    removeStore('fp_access_token'); removeStore('fp_user_id');
    setStore('fp_guest', 'true'); window.location.href = 'firepath_pro.html';
  }

  function showError(el, msg) { el.textContent = msg; el.style.display = 'block'; }

  const hash = new URLSearchParams(window.location.hash.slice(1));
  const accessToken = hash.get('access_token');
  const type = hash.get('type');

  // "Sign out" links across the app point here — clear the session, then show the
  // sign-in form (without the query string, so a refresh doesn't sign out again).
  if (new URLSearchParams(window.location.search).get('action') === 'signout') {
    ['fp_access_token', 'fp_refresh_token', 'fp_user_id', 'fp_email', 'fp_guest', 'fp_is_pro'].forEach(removeStore);
    history.replaceState(null, '', 'auth.html');
  }

  if (type === 'recovery' && accessToken) {
    document.querySelector('.tabs').style.display = 'none';
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('signupForm').style.display = 'none';
    document.getElementById('resetForm').style.display = 'block';
  } else if (type === 'signup' && accessToken) {
    setStore('fp_access_token', accessToken);
    const refreshToken = hash.get('refresh_token');
    if (refreshToken) setStore('fp_refresh_token', refreshToken);
    try {
      const userData = JSON.parse(atob(accessToken.split('.')[1]));
      if (userData.sub) setStore('fp_user_id', userData.sub);
      if (userData.email) setStore('fp_email', userData.email);
    } catch(e) {}
    window.location.href = 'auth.html?upgrade=true';
  } else {
    const token = getStore('fp_access_token');
    const userId = getStore('fp_user_id');
    const validToken = token && token !== 'undefined' && token !== 'null' && token !== '';
    const validUser = userId && userId !== 'undefined' && userId !== 'null' && userId !== '';
    if (validToken && validUser) {
      const params = new URLSearchParams(window.location.search);
      if (params.get('upgrade') === 'true') {
        const uid = getStore('fp_user_id');
        const email = getStore('fp_email');
        fetch(`${WORKER_URL}/stripe/checkout`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: uid, email })
        }).then(r => r.json()).then(data => {
          if (data.url) window.location.href = data.url;
          else window.location.href = landingUrl();
        }).catch(() => window.location.href = landingUrl());
      } else {
        window.location.href = landingUrl();
      }
    } else {
      removeStore('fp_access_token'); removeStore('fp_user_id');
      removeStore('fp_email');
    }
  }
</script>
</body>
</html>
