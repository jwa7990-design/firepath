<style>
  /* ── Chat layout: page header + scrolling thread + input bar pinned to the bottom.
       The page itself doesn't scroll — the thread does — so the input bar always
       sits in view. On mobile it's lifted above the shell's floating tab bar. ── */
  html, body.app { height: 100%; }
  body.app { overflow: hidden; }
  .ask-main {
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    max-width: 760px; padding-bottom: 0;
  }
  @media (min-width: 768px) { .ask-main { padding-bottom: 0; } }
  @media (min-width: 1024px) { .ask-main { padding-bottom: 0; padding-top: 40px; } }
  /* Visitors get the site shell (js/shell.js, data-public): a top nav instead of the
     rail and tab bar, so the column fits under the nav and the bar needs no tab-bar lift. */
  body.site .ask-main { height: calc(100vh - var(--nav-h)); height: calc(100dvh - var(--nav-h)); }
  body.site .chat-input-bar { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  @media (min-width: 1024px) { body.site .chat-input-bar { padding-bottom: 28px; } }
  .ask-main .page-head { flex-shrink: 0; margin-bottom: 0; padding-bottom: 16px; border-bottom: 1px solid var(--line); }

  .chat-thread {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: 20px 2px 16px; display: flex; flex-direction: column; gap: 20px;
  }

  .chat-starters { display: flex; flex-direction: column; gap: 8px; }
  .chat-starters-label { margin-bottom: 4px; }

  /* Suggestion chips — same family as .chip, sized up to be comfortable tap targets */
  .pill-chip {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
    min-height: 40px; padding: 8px 16px 8px 10px; border-radius: 999px; text-align: left;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1);
    font: 500 13.5px/1.35 var(--font-ui); color: var(--ink); cursor: pointer;
    transition: border-color var(--dur-fast) ease, background var(--dur-fast) ease, box-shadow var(--dur-base) var(--ease);
  }
  .pill-chip:hover { border-color: var(--line-strong); box-shadow: var(--shadow-2); }
  .pill-chip:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .pill-chip-icon {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: var(--ember-wash); color: var(--ember-ink);
    display: flex; align-items: center; justify-content: center;
  }

  /* One turn = the user's bubble + FirePath's card reply + follow-up chips */
  .chat-turn { display: flex; flex-direction: column; gap: 10px; animation: fp-rise var(--dur-slow) var(--ease) both; }
  .chat-bubble-user {
    align-self: flex-end; max-width: 82%; background: var(--ink); color: var(--bg);
    border-radius: 18px 18px 4px 18px; padding: 11px 16px; font-size: 14.5px; font-weight: 500; line-height: 1.45;
    overflow-wrap: anywhere;
  }

  /* Reply cards — three tones for the three answer tiers */
  .chat-card { border-radius: var(--r-lg); padding: 18px 20px; max-width: 100%; }
  @media (min-width: 768px) { .chat-card { padding: 22px 24px; } }
  .chat-card-supported { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-2); }
  .chat-card-guided { background: #FFF7F2; border: 1px solid rgba(244,98,42,0.22); }
  .chat-card-unsupported { background: var(--surface-2); border: 1px dashed var(--line-strong); }
  .chat-tag {
    display: inline-flex; align-items: center; margin-bottom: 12px; padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .chat-card-supported .chat-tag { color: var(--positive); background: var(--positive-wash); }
  .chat-card-guided .chat-tag { color: var(--ember-ink); background: var(--ember-wash); }
  .chat-card-unsupported .chat-tag { color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); }
  .chat-headline { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.35; letter-spacing: -0.005em; margin-bottom: 8px; }
  .chat-headline strong { color: var(--ember-ink); font-weight: 700; }
  .chat-body { font-size: 14.5px; color: var(--ink-2); line-height: 1.65; margin-bottom: 14px; }
  .chat-card-unsupported .chat-body { margin-bottom: 0; }
  .chat-stat-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 12px 14px; margin-bottom: 14px;
  }
  .chat-stat-title { font-size: 14px; font-weight: 600; color: var(--ink); }
  .chat-stat-label { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
  .chat-stat-value { font-size: 15px; font-weight: 600; color: var(--ink); text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums lining-nums; }
  .chat-learn-link {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 12px 14px; text-decoration: none; font-size: 13.5px; font-weight: 500; color: var(--ink);
    transition: border-color var(--dur-fast) ease, background var(--dur-fast) ease;
  }
  .chat-learn-link span:last-child { color: var(--ember-ink); flex-shrink: 0; }
  .chat-learn-link:hover { border-color: var(--ember); background: #FFF7F2; }
  .chat-learn-link:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .chat-followups { display: flex; flex-wrap: wrap; gap: 8px; }
  .chat-followups .pill-chip { align-self: auto; }

  /* Input bar — sits above the mobile tab bar (≈76px + safe area), flush at desktop */
  .chat-input-bar {
    flex-shrink: 0; display: flex; align-items: flex-end; gap: 10px;
    margin: 0 -16px; padding: 12px 16px calc(92px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--bg);
  }
  @media (min-width: 768px) { .chat-input-bar { margin: 0 -32px; padding-left: 32px; padding-right: 32px; } }
  @media (min-width: 1024px) { .chat-input-bar { margin: 0; padding: 14px 0 28px; } }
  .chat-input {
    flex: 1; min-width: 0; min-height: 48px; max-height: 100px; resize: none;
    padding: 13px 16px; border-radius: 24px; border: 1px solid var(--line-strong); background: var(--surface);
    font: 400 15px/1.4 var(--font-ui); color: var(--ink); box-shadow: var(--shadow-1);
    transition: border-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
  }
  .chat-input:focus { outline: none; border-color: var(--ember); box-shadow: 0 0 0 3px var(--ember-wash); }
  .chat-input::placeholder { color: var(--ink-3); }
  .chat-send {
    flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--ink); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    transition: opacity var(--dur-fast) ease, transform var(--dur-fast) ease;
  }
  .chat-send:not(:disabled):hover { background: #3F2C1F; }
  .chat-send:not(:disabled):active { transform: scale(0.96); }
  .chat-send:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .chat-send:disabled { opacity: 0.35; cursor: default; }
</style>

<script>
  // Ask FirePath (Pro). The AI explains; FirePath's own engines do the sums.
  // Each question is sent with: the member's saved plan, figures the engines worked out
  // (freedom date and realistic range, ranked moves with their impact), the exact result
  // of any what-if the calculator can answer, and the only links it may suggest. Answers
  // go through FirePathSafe before display. Requests go via the Worker, which checks Pro
  // and applies the AI rate limits.

  const MODEL = 'claude-sonnet-4-6';
  const HISTORY_TURNS = 4;            // the last 4 questions and answers travel with each request
  let PLAN = null;                    // { situation, moves, range, profile } once loaded
  let ARTICLES = [];                  // [{ slug, heading, for }]
  const history = [];                 // [{ role, content }]

  const money = n => '$' + Math.round(n).toLocaleString('en-AU');
  const escapeHtml = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

  // ── The member's plan ────────────────────────────────────
  async function loadPlan() {
    try {
      const res = await fetch(`${WORKER_URL}/db/fp_profiles?id=eq.${getUserId()}`, { headers: { 'Authorization': `Bearer ${getToken()}` } });
      const rows = await res.json();
      const p = Array.isArray(rows) ? rows[0] : null;
      if (!p || !(p.freedom_number > 0)) return null;
      const ranked = FirePathMoves.rank(FirePathMoves.situationFromProfile(p), { limit: 5 });
      const s = ranked.situation;
      let range = null;
      if (!s.alreadyFree && s.freedomNumber > 0) {
        const mc = FirePathEngine.simulateTimeToTarget({ startPortfolio: s.accessibleSavings, monthlySavings: s.savingsMonthly || 0, target: s.freedomNumber });
        range = mc;
      }
      return { profile: p, situation: s, moves: ranked.moves, range };
    } catch (e) { console.log('Plan load failed', e); return null; }
  }

  async function loadArticles() {
    try { ARTICLES = await (await fetch('/learn/articles.json')).json(); } catch (e) { ARTICLES = []; }
  }

  // ── What-ifs the calculator can answer exactly ───────────
  // "save $500 a month", "spend $100 less a week", "retire at 50"
  const AMOUNT = String.raw`\$?(\d[\d,]*(?:\.\d+)?)\s*(k)?`;
  const parseAmount = (num, k) => parseFloat(num.replace(/,/g, '')) * (k ? 1000 : 1);
  const perMonth = (amount, unit) => unit === 'week' ? amount * 52 / 12 : unit === 'fortnight' ? amount * 26 / 12 : amount;
  const yrs = y => y == null ? 'more than 100 years' : y < 1 ? `${Math.round(y * 12)} months` : `${Math.round(y * 10) / 10} years`;

  function calculate(question) {
    if (!PLAN) return null;
    const s = PLAN.situation, q = question.toLowerCase();
    const base = s.yearsToFree;
    let m = q.match(new RegExp(`save.*?${AMOUNT}\\s*(a|per|each|every)?\\s*(week|fortnight|month)`));
    if (m) {
      const extra = perMonth(parseAmount(m[1], m[2]), m[4]);
      const after = FirePathMoves.yearsTo(s.freedomNumber, s.accessibleSavings, (s.savingsMonthly || 0) + extra, 0.07);
      return `Saving an extra ${money(extra)} a month: freedom in ${yrs(after)} instead of ${yrs(base)} (7% real return, today's dollars).`;
    }
    m = q.match(new RegExp(`spend.*?${AMOUNT}\\s*less\\s*(a|per|each|every)?\\s*(week|fortnight|month)`));
    if (m) {
      const cut = perMonth(parseAmount(m[1], m[2]), m[4]);
      const newTarget = Math.max(0, s.freedomNumber - cut * 12 * 25 * (s.retirementSpendMultiplier || 1));
      const after = FirePathMoves.yearsTo(newTarget, s.accessibleSavings, (s.savingsMonthly || 0) + cut, 0.07);
      return `Spending ${money(cut)} a month less (and saving it): freedom number ${money(newTarget)}, reached in ${yrs(after)} instead of ${yrs(base)}.`;
    }
    m = q.match(/retire.*?\b(\d{2})\b|\b(\d{2})\b.*?(retire|retirement)/);
    if (m && s.age) {
      const target = parseInt(m[1] || m[2], 10), years = target - s.age;
      if (years > 0 && years < 60) {
        const at = FirePathEngine.projectPortfolio(s.accessibleSavings, s.savingsMonthly || 0, years, 0.07);
        const income = at * 0.04, spend = s.freedomNumber / 25;
        return `Retiring at ${target} (in ${years} years): savings outside super reach about ${money(at)}, paying ${money(income)} a year at 4% vs ${money(spend)} needed — ${income >= spend ? 'enough' : 'a shortfall of ' + money(spend - income) + ' a year'}.` + (target < 60 && s.superBalance > 0 ? ' Super stays locked until 60, so it can\'t help before then.' : '');
      }
    }
    return null;
  }

  // ── What the AI is told ──────────────────────────────────
  const TOOL_LINKS = [
    ['/firepath_pro', 'Full Analysis'], ['/journey', 'Your Journey'], ['/strategy', 'Strategy'], ['/tax_pro', 'Tax tools'],
    ['/hearmeout', 'Scenario explorer'], ['/withdrawal', 'Withdrawal stress test'], ['/freedom-gap', 'Freedom gap'],
    ['/compound', 'Compounding'], ['/progress', 'Check in'],
  ];

  function systemPrompt() {
    const lines = [
      'You are Ask FirePath, the assistant inside FirePath Pro, an Australian financial-independence planner. You help one member understand their own plan.',
      'Rules:',
      '- Educational only, not financial advice. Explain, compare options and show trade-offs; never tell them what they must do, and never recommend specific products, funds, providers or shares.',
      '- Australian context: super (locked until preservation age 60), the Age Pension from 67, ATO rules, AUD.',
      '- Numbers: only use the figures below or a CALCULATED note in the question. If you need another figure, give a clearly labelled rough estimate and how you got it. Never invent their numbers.',
      '- If something depends on facts you do not have (e.g. an interest rate), say what it depends on.',
      '- Plain English, under 150 words, short paragraphs. Use **bold** for key numbers.',
      '- If the question is not about money or their plan, say briefly what you can help with.',
      '- Finish with exactly one next step as [[link:/path|Short label]], choosing the path ONLY from ALLOWED LINKS.',
      '',
    ];
    if (PLAN) {
      const s = PLAN.situation, p = PLAN.profile;
      const rng = PLAN.range;
      lines.push('MEMBER (household, today\'s dollars):');
      lines.push(`- Age ${s.age ?? 'unknown'}${s.hasPartner ? `, with a partner${s.partnerAge ? ` aged ${s.partnerAge}` : ''}` : ''}${s.dependants > 0 ? `, ${s.dependants} dependant(s)` : ''}. Housing: ${s.housing || 'unknown'}${s.mortgageRemaining > 0 ? `, ${money(s.mortgageRemaining)} mortgage` : ''}.`);
      lines.push(`- Take-home ${money(s.takeHomeMonthly || 0)}/month; saving ${money(s.savingsMonthly || 0)}/month${s.savingsRate != null ? ` (${Math.round(s.savingsRate * 100)}% savings rate)` : ''}.`);
      lines.push(`- Savings outside super ${money(s.currentSavings || 0)} held as ${s.savingsType || 'unknown'}; super ${money(s.superBalance || 0)}${s.partnerSuper > 0 ? `; partner's super ${money(s.partnerSuper)}` : ''}; consumer debt ${money(s.consumerDebt || 0)}.`);
      if (s.grossIncome) lines.push(`- Estimated own gross income ${money(s.grossIncome)}${s.marginalRate != null ? `, marginal tax rate about ${Math.round(s.marginalRate * 100)}%` : ''}.`);
      lines.push(`- Freedom number ${money(s.freedomNumber)} (25 × yearly spending in retirement).`);
      lines.push(s.alreadyFree ? '- Already free: accessible savings cover the freedom number.'
        : `- At 7% real: free in ${yrs(s.yearsToFree)}${s.freedomAge ? ` (around age ${Math.round(s.freedomAge)})` : ''}.` + (rng && rng.early != null ? ` Across 2,000 market futures, 8 in 10 land between ${yrs(rng.early / 12)} and ${rng.late != null ? yrs(rng.late / 12) : 'over 50 years'}.` : ''));
      if (p.context) lines.push(`- In their words: "${String(p.context).slice(0, 300)}"`);
      lines.push('', 'FIREPATH\'S RANKED MOVES FOR THEM (best first, from its own engine):');
      PLAN.moves.forEach((m, i) => lines.push(`${i + 1}. ${m.title} — ${m.impact.text}. ${m.why}`));
      if (!PLAN.moves.length) lines.push('(none — nothing would clearly improve their outcome right now)');
    } else {
      lines.push('MEMBER: no saved plan yet. Answer generally and suggest running Full Analysis (/firepath_pro) to get answers built on their own numbers.');
    }
    const fits = PLAN ? ARTICLES.filter(a => FirePathMoves.articleFits(a.for, PLAN.situation)) : ARTICLES;
    lines.push('', 'ALLOWED LINKS:');
    TOOL_LINKS.forEach(([h, l]) => lines.push(`${h} | ${l}`));
    fits.forEach(a => lines.push(`/learn/${a.slug} | ${a.heading}`));
    return lines.join('\n').slice(0, 11800);
  }

  // ── Showing an answer safely ─────────────────────────────
  function allowedHref(href) {
    return TOOL_LINKS.some(([h]) => h === href) || (/^\/learn\/[a-z0-9-]+$/.test(href) && ARTICLES.some(a => '/learn/' + a.slug === href));
  }
  function renderAnswer(text) {
    const links = [];
    const body = String(text || '').replace(/\[\[link:([^|\]]+)\|([^\]]+)\]\]/g, (_, href, label) => {
      href = href.trim();
      if (allowedHref(href)) links.push({ href, label: label.trim() });
      return '';
    }).trim();
    const linkHtml = links.slice(0, 2).map(l => `<a href="${l.href}" class="chat-learn-link"><span>${escapeHtml(l.label)}</span><span>→</span></a>`).join('');
    return `<div class="chat-card chat-card-supported">
      <span class="chat-tag">${PLAN ? '✓ Built on your saved plan' : 'General answer — save a plan in Full Analysis for answers about your numbers'}</span>
      <div class="chat-body">${FirePathSafe.aiText(body)}</div>${linkHtml}</div>`;
  }
  const notice = (tag, text, link) => `<div class="chat-card chat-card-guided"><span class="chat-tag">${tag}</span><div class="chat-body">${text}</div>${link || ''}</div>`;

  // ── The conversation ─────────────────────────────────────
  const thread = document.getElementById('chatThread');
  let busy = false;

  async function ask(question) {
    if (busy || !question) return;
    busy = true; setSending(true);
    document.getElementById('chatStarters')?.remove();
    const turn = document.createElement('div');
    turn.className = 'chat-turn';
    turn.innerHTML = `<div class="chat-bubble-user">${escapeHtml(question)}</div><div class="chat-card chat-card-supported"><span class="chat-tag">Thinking…</span><div class="chat-body">Working through your numbers…</div></div>`;
    thread.appendChild(turn); thread.scrollTop = thread.scrollHeight;
    const reply = turn.lastElementChild;

    const calc = calculate(question);
    const userContent = calc ? `${question}\n\nCALCULATED by FirePath for this question: ${calc}` : question;
    const messages = history.slice(-HISTORY_TURNS * 2).concat([{ role: 'user', content: userContent }]);
    try {
      const res = await fetch(WORKER_URL, { method: 'POST', headers: aiHeaders(), body: JSON.stringify({ model: MODEL, max_tokens: 700, system: systemPrompt(), messages }) });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401 || res.status === 403) { reply.outerHTML = notice('Part of Pro', 'Ask FirePath is part of FirePath Pro.', '<a href="/upgrade" class="chat-learn-link"><span>See Pro</span><span>→</span></a>'); return; }
      if (res.status === 429) { reply.outerHTML = notice('Taking a breather', escapeHtml(data.error || "You've asked a lot of questions in a short time — please try again in a little while.")); return; }
      const text = res.ok && data.content && data.content[0] && data.content[0].text;
      if (!text) throw new Error('No answer');
      history.push({ role: 'user', content: userContent }, { role: 'assistant', content: text });
      reply.outerHTML = renderAnswer(text);
    } catch (e) {
      reply.outerHTML = notice('Try again', 'Ask FirePath couldn’t answer just now. Please try again in a minute.');
    } finally {
      busy = false; setSending(false);
      thread.scrollTop = thread.scrollHeight;
    }
  }

  const askInput = document.getElementById('askInput');
  const askSubmit = document.getElementById('askSubmit');
  function setSending(on) { askSubmit.disabled = on || askInput.value.trim().length === 0; askInput.disabled = on; }
  function autoGrow() { askInput.style.height = 'auto'; askInput.style.height = Math.min(askInput.scrollHeight, 100) + 'px'; }
  function submitQuestion() { const q = askInput.value.trim().slice(0, 1000); if (!q || busy) return; askInput.value = ''; autoGrow(); ask(q); }
  askInput.addEventListener('input', () => { askSubmit.disabled = busy || askInput.value.trim().length === 0; autoGrow(); });
  askInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuestion(); } });
  askSubmit.addEventListener('click', submitQuestion);
  document.querySelectorAll('#chatStarters .pill-chip').forEach(chip => chip.addEventListener('click', () => ask(chip.dataset.q)));

  // Pro only. Then load the plan and article list; a ?q= deep link (Learning Lab search) asks straight away.
  (async () => {
    if (!(await requirePro())) return;
    await Promise.all([loadArticles(), loadAssumptions().catch(() => {})]);
    PLAN = await loadPlan();
    if (!PLAN) thread.insertAdjacentHTML('afterbegin', notice('No saved plan yet', 'Answers are general until you save your plan — run Full Analysis once and Ask FirePath will use your own numbers.', '<a href="/firepath_pro" class="chat-learn-link"><span>Run Full Analysis</span><span>→</span></a>'));
    const q = new URLSearchParams(location.search).get('q');
    if (q) ask(q.slice(0, 1000));
  })();
</script>
