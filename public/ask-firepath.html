<style>
  /* ── Ask FirePath: an editorial chat. The page doesn't scroll — the thread does — so the
       input bar always sits in view. Every row (head, thread, note, bar) centres a ~720px
       reading column with padding, so the thread's scrollbar sits at the page edge.
       On mobile the bar is lifted above the shell's tab bar. ── */
  html, body.app { height: 100%; }
  body.app { overflow: hidden; }
  .ask-main { --col: 720px; --gut: 16px; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  @media (min-width: 768px) { .ask-main { --gut: 32px; } }
  .ask-main > * { padding-left: max(var(--gut), calc((100% - var(--col)) / 2)); padding-right: max(var(--gut), calc((100% - var(--col)) / 2)); }
  /* Visitors get the site shell (js/shell.js, data-public): a top nav instead of the
     rail and tab bar, so the column fits under the nav and the bar needs no tab-bar lift. */
  body.site .ask-main { height: calc(100vh - var(--nav-h)); height: calc(100dvh - var(--nav-h)); }
  body.site .chat-input-bar { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  @media (min-width: 1024px) { body.site .chat-input-bar { padding-bottom: 28px; } }

  .ask-head { flex-shrink: 0; padding-top: 24px; padding-bottom: 18px; border-bottom: var(--hp-rule); }
  @media (min-width: 768px) { .ask-head { padding-top: 40px; padding-bottom: 22px; } }
  @media (min-width: 1024px) { .ask-head { padding-top: 48px; } }
  .ask-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 4.4vw, 52px); line-height: 1.02; letter-spacing: -0.028em; color: var(--ink); }
  .ask-sub { margin-top: 10px; max-width: 54ch; font-size: clamp(15px, 1.4vw, 17px); line-height: 1.5; color: var(--ink); }

  .chat-thread {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding-top: 28px; padding-bottom: 20px; display: flex; flex-direction: column; gap: 0;
  }

  /* Starter questions: large text options on a ruled list, not pills */
  .chat-starters { display: flex; flex-direction: column; }
  .chat-starters-label { margin-bottom: 14px; }
  .chat-starters .pill-chip { border-top: 0; }
  .chat-starters-label + .pill-chip { border-top: 1px solid var(--ink); }
  .pill-chip {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px; width: 100%;
    padding: 16px 2px; background: none; border: 0; border-bottom: var(--hp-rule); border-radius: 0; text-align: left; cursor: pointer;
    font-family: var(--font-display); font-weight: 700; font-size: clamp(19px, 2.1vw, 24px); line-height: 1.25; letter-spacing: -0.01em; color: var(--ink);
    transition: border-color var(--dur-fast) ease;
  }
  .pill-chip::after { content: '→'; flex-shrink: 0; font-family: var(--font-ui); font-weight: 400; font-size: 18px; color: var(--ink-2); transition: transform var(--dur-base) var(--ease), color var(--dur-fast) ease; }
  .pill-chip:hover { border-bottom-color: var(--ink); }
  .pill-chip:hover::after { transform: translateX(4px); color: var(--ink); }
  .pill-chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
  .pill-chip-icon { display: none; }

  /* One turn = the question, then FirePath's answer; thin rules between turns */
  .chat-turn { display: flex; flex-direction: column; gap: 16px; padding: 28px 0 30px; border-top: var(--hp-rule); animation: fp-rise var(--dur-slow) var(--ease) both; }
  .chat-starters + .chat-turn, .chat-thread > .chat-turn:first-child { border-top: 0; padding-top: 4px; }
  .chat-bubble-user {
    font-family: var(--font-display); font-weight: 700; font-size: clamp(22px, 2.5vw, 28px); line-height: 1.2; letter-spacing: -0.015em;
    color: var(--ink); overflow-wrap: anywhere;
  }

  /* Answers: no boxes. A small ink label, the words in a serif reading face. */
  .chat-card { max-width: 100%; }
  .chat-card-guided { padding-top: 16px; border-top: 2px solid var(--hp-accent); }
  .chat-thread > .chat-card-guided { margin-bottom: 28px; }
  .chat-card-unsupported { padding-top: 16px; border-top: 1px solid var(--ink); }
  .chat-tag { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink); }
  .chat-tag::before { content: ''; flex-shrink: 0; width: 8px; height: 8px; background: var(--hp-accent); }
  .chat-card-supported .chat-tag::before { background: none; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .chat-headline { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--ink); line-height: 1.3; margin-bottom: 8px; }
  .chat-headline strong { color: var(--hp-accent); font-weight: 700; }
  .chat-body { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1.65; color: var(--ink); margin-bottom: 18px; overflow-wrap: break-word; }
  @media (min-width: 768px) { .chat-body { font-size: 19px; } }
  .chat-body p + p, .chat-body p + ul, .chat-body ul + p { margin-top: 0.8em; }
  .chat-body strong { font-weight: 700; }
  .chat-body ul, .chat-body ol { padding-left: 1.2em; }
  .chat-card-unsupported .chat-body { margin-bottom: 0; }
  .chat-stat-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 2px; margin-bottom: 14px; border-top: 1px solid var(--ink); border-bottom: var(--hp-rule); }
  .chat-stat-title { font-size: 15px; font-weight: 600; color: var(--ink); }
  .chat-stat-label { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
  .chat-stat-value { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--ink); text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums lining-nums; }
  /* Links out: ruled rows with the arrow nudging on hover */
  .chat-learn-link {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 14px 2px; border-top: 1px solid var(--ink); border-bottom: var(--hp-rule); text-decoration: none;
    font-size: 16px; font-weight: 600; color: var(--ink); transition: border-color var(--dur-fast) ease;
  }
  .chat-learn-link + .chat-learn-link { border-top: 0; }
  .chat-learn-link span:last-child { flex-shrink: 0; color: var(--ink-2); transition: transform var(--dur-base) var(--ease); }
  .chat-learn-link:hover { border-bottom-color: var(--ink); }
  .chat-learn-link:hover span:first-child { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  .chat-learn-link:hover span:last-child { transform: translateX(4px); color: var(--ink); }
  .chat-learn-link:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
  /* General-advice note: always visible above the input, and repeated under each answer. */
  .chat-advice { flex-shrink: 0; margin: 0; padding-top: 10px; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
  .chat-card .chat-advice { padding: 12px 0 0; }
  .chat-followups { display: flex; flex-direction: column; }

  /* Input bar: one clean bar, the send button inside it. Above the mobile tab bar
     (≈76px + safe area), flush at desktop. */
  .chat-input-bar { flex-shrink: 0; padding-top: 10px; padding-bottom: calc(92px + env(safe-area-inset-bottom)); background: var(--bg); }
  @media (min-width: 1024px) { .chat-input-bar { padding-bottom: 28px; } }
  .chat-input-box {
    display: flex; align-items: flex-end; gap: 8px; padding: 6px 6px 6px 18px;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--hp-r);
    transition: border-color var(--dur-fast) ease;
  }
  .chat-input-box:focus-within { border-color: var(--ink); }
  .chat-input {
    flex: 1; min-width: 0; min-height: 44px; max-height: 100px; resize: none; padding: 11px 0; border: 0; background: none;
    font: 400 16.5px/1.4 var(--font-ui); color: var(--ink);
  }
  .chat-input:focus { outline: none; }
  .chat-input::placeholder { color: var(--ink-2); }
  .chat-send {
    flex-shrink: 0; width: 44px; height: 44px; border-radius: 6px; border: none; cursor: pointer;
    background: var(--ink); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    transition: opacity var(--dur-fast) ease, background var(--dur-fast) ease;
  }
  .chat-send:not(:disabled):hover { background: #3F2C1F; }
  .chat-send:not(:disabled):active { transform: translateY(1px); }
  .chat-send:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .chat-send:disabled { opacity: 0.3; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .pill-chip::after, .chat-learn-link span:last-child { transition: none !important; } }
</style>

<body class="app" data-shell="app" data-footer="none" data-active="ask">
<script src="js/shell.js"></script>

<main class="hp ask-main" id="main">

  <header class="ask-head">
    <h1 class="ask-title">Ask FirePath</h1>
    <p class="ask-sub">Ask anything about your plan — answered by AI, with FirePath’s maths doing the sums.</p>
  </header>

  <div class="chat-thread" id="chatThread">
    <div class="chat-starters" id="chatStarters">
      <p class="chat-starters-label hp-label is-ink">Popular questions</p>
      <button class="pill-chip" type="button">What if I save an extra $250 a month?</button>
      <button class="pill-chip" type="button">What if I spend $150 less a week?</button>
      <button class="pill-chip" type="button">What if I retire at 40?</button>
      <button class="pill-chip" type="button">What would paying off debt vs investing do to my date?</button>
      <button class="pill-chip" type="button">How does salary sacrifice change my numbers?</button>
    </div>
  </div>

  <p class="chat-advice" id="askAdvice">General information, not financial advice. FirePath isn’t a licensed adviser.</p>
  <div class="chat-input-bar">

      <textarea class="chat-input" id="askInput" rows="1" aria-label="Your question" placeholder="Ask anything about your plan…"></textarea>

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

</main>

<script>
  // Ask FirePath (Pro). The AI explains; FirePath's own engines do the sums.
  // Each question is sent with: the member's saved plan, figures the engines worked out
  // (freedom date and realistic range, options with their modelled effect), the exact result
  // of any what-if the calculator can answer, and the only links it may suggest. Answers
  // go through FirePathSafe before display. Requests go via the Worker, which checks Pro
  // and applies the AI rate limits (and adds its own server-side rules to the prompt).
  // General information only: the AI explains options and trade-offs in the member's
  // numbers and never says which to choose. The note above the input and under each
  // answer says so on screen.

  const MODEL = 'claude-sonnet-4-6';
  const HISTORY_TURNS = 4;            // the last 4 questions and answers travel with each request
  let PLAN = null;                    // { situation, moves, range, profile } once loaded
  let ARTICLES = [];                  // [{ slug, heading, for }]
  const history = [];                 // [{ role, content }]

  const money = n => '$' + Math.round(n).toLocaleString('en-AU');
  const escapeHtml = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

  // ── The member's plan ────────────────────────────────────
  async function loadPlan() {
    try {
      const res = await FirePathAuth.fetch(`${WORKER_URL}/db/fp_profiles?id=eq.${getUserId()}`, { headers: { 'Authorization': `Bearer ${getToken()}` } });
      const rows = await res.json();
      const p = Array.isArray(rows) ? rows[0] : null;
      if (!p || !(p.freedom_number > 0)) return null;
      const ranked = FirePathMoves.rank(FirePathMoves.situationFromProfile(p), { limit: 5 });
      const s = ranked.situation;
      let range = null;
      if (!s.alreadyFree && s.freedomNumber > 0) {
        const mc = FirePathEngine.simulateTimeToTarget({ startPortfolio: s.accessibleSavings, monthlySavings: s.savingsMonthly || 0, target: s.freedomNumber });
        range = mc;
      }
      return { profile: p, situation: s, moves: ranked.moves, range };
    } catch (e) { console.log('Plan load failed', e); return null; }
  }

  async function loadArticles() {
    try { ARTICLES = await (await fetch('/learn/articles.json')).json(); } catch (e) { ARTICLES = []; }
  }

  // ── What-ifs the calculator can answer exactly ───────────
  // "save $500 a month", "spend $100 less a week", "retire at 50"
  const AMOUNT = String.raw`\$?(\d[\d,]*(?:\.\d+)?)\s*(k)?`;
  const parseAmount = (num, k) => parseFloat(num.replace(/,/g, '')) * (k ? 1000 : 1);
  const perMonth = (amount, unit) => unit === 'week' ? amount * 52 / 12 : unit === 'fortnight' ? amount * 26 / 12 : amount;
  const yrs = y => y == null ? 'more than 100 years' : y < 1 ? `${Math.round(y * 12)} months` : `${Math.round(y * 10) / 10} years`;

  function calculate(question) {
    if (!PLAN) return null;
    const s = PLAN.situation, q = question.toLowerCase();
    const base = s.yearsToFree;
    // "After" figures on the same plan as the "before" one (FirePathMoves.planYears →
    // FirePathEngine.freedomPlan); the simple timeline only if the engine isn't there.
    const yearsWith = (over, fallback) => { const y = FirePathMoves.planYears ? FirePathMoves.planYears(s, over) : undefined; return y !== undefined ? y : fallback(); };
    let m = q.match(new RegExp(`save.*?${AMOUNT}\\s*(a|per|each|every)?\\s*(week|fortnight|month)`));
    if (m) {
      const extra = perMonth(parseAmount(m[1], m[2]), m[4]);
      const after = yearsWith({ monthlySavings: (s.savingsMonthly || 0) + extra }, () => FirePathMoves.yearsTo(s.freedomNumber, s.accessibleSavings, (s.savingsMonthly || 0) + extra, 0.07));
      return `Saving an extra ${money(extra)} a month: freedom in ${yrs(after)} instead of ${yrs(base)} (same plan as your date: 7% a year after inflation less tax, super from 60, today's dollars).`;
    }
    m = q.match(new RegExp(`spend.*?${AMOUNT}\\s*less\\s*(a|per|each|every)?\\s*(week|fortnight|month)`));
    if (m) {
      const cut = perMonth(parseAmount(m[1], m[2]), m[4]);
      const newTarget = Math.max(0, s.freedomNumber - cut * 12 * 25 * (s.retirementSpendMultiplier || 1));
      const after = yearsWith({ target: newTarget, monthlySavings: (s.savingsMonthly || 0) + cut }, () => FirePathMoves.yearsTo(newTarget, s.accessibleSavings, (s.savingsMonthly || 0) + cut, 0.07));
      return `Spending ${money(cut)} a month less (and saving it): freedom number ${money(newTarget)}, reached in ${yrs(after)} instead of ${yrs(base)}.`;
    }
    m = q.match(/retire.*?\b(\d{2})\b|\b(\d{2})\b.*?(retire|retirement)/);
    if (m && s.age) {
      const target = parseInt(m[1] || m[2], 10), years = target - s.age;
      if (years > 0 && years < 60) {
        // The plan's after-tax return, and the safer withdrawal rate for that stopping age.
        const head = PLAN.profile && FirePathEngine.planInputsFromProfile ? FirePathEngine.freedomPlan(Object.assign({}, FirePathEngine.planInputsFromProfile(PLAN.profile), { safeRate: false })) : null;
        const rate = head && head.valid && Number.isFinite(head.outsideReturn) ? head.outsideReturn : 0.07;
        const wr = FirePathEngine.safeWithdrawalRate ? FirePathEngine.safeWithdrawalRate(target) : 0.04;
        const at = FirePathEngine.projectPortfolio(s.accessibleSavings, s.savingsMonthly || 0, years, rate);
        const income = at * wr, spend = s.freedomNumber / 25;
        return `Retiring at ${target} (in ${years} years): savings outside super reach about ${money(at)}, paying ${money(income)} a year at ${Math.round(wr * 1000) / 10}% (a safer rate the earlier you stop) vs ${money(spend)} needed — ${income >= spend ? 'enough' : 'a shortfall of ' + money(spend - income) + ' a year'}.` + (target < 60 && s.superBalance > 0 ? ' Super stays locked until 60, so it can\'t help before then.' : '');
      }
    }
    return null;
  }

  // ── What the AI is told ──────────────────────────────────
  const TOOL_LINKS = [
    ['/firepath_pro', 'Your full plan'], ['/journey', 'Journey'], ['/strategy', 'Strategy'], ['/tax_pro', 'Tax tools'],
    ['/hearmeout', 'What if…?'], ['/withdrawal', 'Withdrawal planner'], ['/freedom-gap', 'Freedom gap'],
    ['/compound', 'Compound interest'], ['/progress', 'Check in'],
  ];

  function systemPrompt() {
    const lines = [
      'You are Ask FirePath, the assistant inside FirePath Pro, an Australian financial-independence planner. You help one member understand their own plan.',
      'Rules:',
      '- General information only, not financial advice. Explain what each option would do in their numbers and the trade-offs. Never say which option they should choose, never rank options as "best" for them, and never use "you should" or "I recommend".',
      '- For "should I…" questions, lay out both sides using their numbers, then say a licensed financial adviser can give a personal recommendation.',
      '- Never name specific products, funds, ETFs, brokers, banks, lenders, super funds or platforms.',
      '- Australian context: super (locked until preservation age 60), the Age Pension from 67, ATO rules, AUD.',
      '- Numbers: only use the figures below or a CALCULATED note in the question. If you need another figure, give a clearly labelled rough estimate and how you got it. Never invent their numbers.',
      '- If something depends on facts you do not have (e.g. an interest rate), say what it depends on.',
      '- Plain English, under 150 words, short paragraphs. Use **bold** for key numbers.',
      '- If the question is not about money or their plan, say briefly what you can help with.',
      '- Finish with exactly one link to explore further as [[link:/path|Short label]], choosing the path ONLY from ALLOWED LINKS.',
      '',
    ];
    // ALLOWED LINKS come before the member's data so they survive the Worker's 8,000-character
    // cut. Articles tied to this person's options go first; the list is capped so the plan fits too.
    const fits = PLAN ? ARTICLES.filter(a => FirePathMoves.articleFits(a.for, PLAN.situation)) : ARTICLES;
    const optionSlugs = PLAN ? PLAN.moves.map(m => m.article).filter(Boolean) : [];
    const ordered = fits.filter(a => optionSlugs.includes(a.slug)).concat(fits.filter(a => !optionSlugs.includes(a.slug)));
    lines.push('ALLOWED LINKS:');
    TOOL_LINKS.forEach(([h, l]) => lines.push(`${h} | ${l}`));
    let linkChars = 0;
    for (const a of ordered) {
      const line = `/learn/${a.slug} | ${a.heading}`;
      if (linkChars + line.length > 3000) break;
      linkChars += line.length + 1;
      lines.push(line);
    }
    lines.push('');
    if (PLAN) {
      const s = PLAN.situation, p = PLAN.profile;
      const rng = PLAN.range;
      lines.push('MEMBER (household, today\'s dollars):');
      lines.push(`- Age ${s.age ?? 'unknown'}${s.hasPartner ? `, with a partner${s.partnerAge ? ` aged ${s.partnerAge}` : ''}` : ''}${s.dependants > 0 ? `, ${s.dependants} dependant(s)` : ''}. Housing: ${s.housing || 'unknown'}${s.mortgageRemaining > 0 ? `, ${money(s.mortgageRemaining)} mortgage` : ''}.`);
      lines.push(`- Take-home ${money(s.takeHomeMonthly || 0)}/month; saving ${money(s.savingsMonthly || 0)}/month${s.savingsRate != null ? ` (${Math.round(s.savingsRate * 100)}% savings rate)` : ''}.`);
      lines.push(`- Savings outside super ${money(s.currentSavings || 0)} held as ${s.savingsType || 'unknown'}; super ${money(s.superBalance || 0)}${s.partnerSuper > 0 ? `; partner's super ${money(s.partnerSuper)}` : ''}; consumer debt ${money(s.consumerDebt || 0)}.`);
      if (s.grossIncome) lines.push(`- Estimated own gross income ${money(s.grossIncome)}${s.marginalRate != null ? `, marginal tax rate about ${Math.round(s.marginalRate * 100)}%` : ''}.`);
      lines.push(`- Freedom number ${money(s.freedomNumber)} (25 × yearly spending in retirement).`);
      lines.push(s.alreadyFree ? '- Already free: accessible savings cover the freedom number.'
        : `- At 7% real: free in ${yrs(s.yearsToFree)}${s.freedomAge ? ` (around age ${Math.round(s.freedomAge)})` : ''}.` + (rng && rng.early != null ? ` Across 2,000 possible market outcomes, 8 in 10 land between ${yrs(rng.early / 12)} and ${rng.late != null ? yrs(rng.late / 12) : 'over 50 years'}.` : ''));
      if (p.context) lines.push(`- In their words: "${String(p.context).slice(0, 300)}"`);
      lines.push('', 'OPTIONS AND THEIR MODELLED EFFECT ON THIS PERSON\'S NUMBERS (from FirePath\'s own engine; listed by size of modelled effect, which is not a recommendation):');
      PLAN.moves.forEach((m, i) => lines.push(`${i + 1}. ${m.title} — ${m.impact.text}. ${m.why}`));
      if (!PLAN.moves.length) lines.push('(none — none of the standard options would clearly change their numbers right now)');
    } else {
      lines.push('MEMBER: no saved plan yet. Answer generally and suggest filling in Your full plan (/firepath_pro) to get answers built on their own numbers.');
    }
    return lines.join('\n').slice(0, 8000);   // the Worker cuts system text at 8,000 characters
  }

  // ── Showing an answer safely ─────────────────────────────
  function allowedHref(href) {
    return TOOL_LINKS.some(([h]) => h === href) || (/^\/learn\/[a-z0-9-]+$/.test(href) && ARTICLES.some(a => '/learn/' + a.slug === href));
  }
  function renderAnswer(text) {
    const links = [];
    const body = String(text || '').replace(/\[\[link:([^|\]]+)\|([^\]]+)\]\]/g, (_, href, label) => {
      href = href.trim();
      if (allowedHref(href)) links.push({ href, label: label.trim() });
      return '';
    }).trim();
    const linkHtml = links.slice(0, 2).map(l => `<a href="${l.href}" class="chat-learn-link"><span>${escapeHtml(l.label)}</span><span>→</span></a>`).join('');
    return `<div class="chat-card chat-card-supported">
      <span class="chat-tag">${PLAN ? 'Built on your saved plan' : 'General answer. Save your full plan to get answers about your own numbers'}</span>
      <div class="chat-body">${FirePathSafe.aiText(body)}</div>${linkHtml}<p class="chat-advice">General information, not financial advice. FirePath isn’t a licensed adviser.</p></div>`;
  }
  const notice = (tag, text, link) => `<div class="chat-card chat-card-guided"><span class="chat-tag">${tag}</span><div class="chat-body">${text}</div>${link || ''}</div>`;

  // ── The conversation ─────────────────────────────────────
  const thread = document.getElementById('chatThread');
  let busy = false;

  async function ask(question) {
    if (busy || !question) return;
    busy = true; setSending(true);
    document.getElementById('chatStarters')?.remove();
    const turn = document.createElement('div');
    turn.className = 'chat-turn';
    turn.innerHTML = `<div class="chat-bubble-user">${escapeHtml(question)}</div><div class="chat-card chat-card-supported"><span class="chat-tag">Thinking…</span><div class="chat-body">Working through your numbers…</div></div>`;
    thread.appendChild(turn); thread.scrollTop = thread.scrollHeight;
    const reply = turn.lastElementChild;

    const calc = calculate(question);
    const userContent = calc ? `${question}\n\nCALCULATED by FirePath for this question: ${calc}` : question;
    const messages = history.slice(-HISTORY_TURNS * 2).concat([{ role: 'user', content: userContent }]);
    try {
      const res = await FirePathAuth.fetch(WORKER_URL, { method: 'POST', headers: aiHeaders(), body: JSON.stringify({ model: MODEL, max_tokens: 700, system: systemPrompt(), messages }) });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401 || res.status === 403) { reply.outerHTML = notice('Part of Pro', 'Ask FirePath is part of FirePath Pro.', '<a href="/upgrade" class="chat-learn-link"><span>See Pro</span><span>→</span></a>'); return; }
      if (res.status === 429) { reply.outerHTML = notice('Taking a breather', escapeHtml(data.error || "You've asked a lot of questions in a short time — please try again in a little while.")); return; }
      const text = res.ok && data.content && data.content[0] && data.content[0].text;
      if (!text) throw new Error('No answer');
      history.push({ role: 'user', content: userContent }, { role: 'assistant', content: text });
      reply.outerHTML = renderAnswer(text);
    } catch (e) {
      reply.outerHTML = notice('Try again', 'Ask FirePath couldn’t answer just now. Please try again in a minute.');
    } finally {
      busy = false; setSending(false);
      thread.scrollTop = thread.scrollHeight;
    }
  }

  const askInput = document.getElementById('askInput');
  const askSubmit = document.getElementById('askSubmit');
  function setSending(on) { askSubmit.disabled = on || askInput.value.trim().length === 0; askInput.disabled = on; }
  function autoGrow() { askInput.style.height = 'auto'; askInput.style.height = Math.min(askInput.scrollHeight, 100) + 'px'; }
  function submitQuestion() { const q = askInput.value.trim().slice(0, 1000); if (!q || busy) return; askInput.value = ''; autoGrow(); ask(q); }
  askInput.addEventListener('input', () => { askSubmit.disabled = busy || askInput.value.trim().length === 0; autoGrow(); });
  askInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuestion(); } });
  askSubmit.addEventListener('click', submitQuestion);
  // A chip sends exactly the question it shows.
  document.querySelectorAll('#chatStarters .pill-chip').forEach(chip => chip.addEventListener('click', () => ask(chip.textContent.trim())));

  // Pro only. Then load the plan and article list; a ?q= deep link (Learning Lab search) asks straight away.
  (async () => {
    if (!(await requirePro())) return;
    await Promise.all([loadArticles(), loadAssumptions().catch(() => {})]);
    PLAN = await loadPlan();
    if (!PLAN) thread.insertAdjacentHTML('afterbegin', notice('No saved plan yet', 'Answers are general until you save your plan. Fill in your full plan once and Ask FirePath will use your own numbers.', '<a href="/firepath_pro" class="chat-learn-link"><span>Open Your full plan</span><span>→</span></a>'));
    const q = new URLSearchParams(location.search).get('q');
    if (q) ask(q.slice(0, 1000));
  })();
</script>

</body>
</html>
