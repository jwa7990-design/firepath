<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>FirePath — Ask FirePath</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>

<script src="js/auth.js"></script>

<style>
  /* ── Chat layout: page header + scrolling thread + input bar pinned to the bottom.
       The page itself doesn't scroll — the thread does — so the input bar always
       sits in view. On mobile it's lifted above the shell's floating tab bar. ── */
  html, body.app { height: 100%; }
  body.app { overflow: hidden; }
  .ask-main {
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    max-width: 760px; padding-bottom: 0;
  }
  @media (min-width: 768px) { .ask-main { padding-bottom: 0; } }
  @media (min-width: 1024px) { .ask-main { padding-bottom: 0; padding-top: 40px; } }
  .ask-main .page-head { flex-shrink: 0; margin-bottom: 0; padding-bottom: 16px; border-bottom: 1px solid var(--line); }

  .chat-thread {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    padding: 20px 2px 16px; display: flex; flex-direction: column; gap: 20px;
  }

  .chat-starters { display: flex; flex-direction: column; gap: 8px; }
  .chat-starters-label { margin-bottom: 4px; }

  /* Suggestion chips — same family as .chip, sized up to be comfortable tap targets */
  .pill-chip {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
    min-height: 40px; padding: 8px 16px 8px 10px; border-radius: 999px; text-align: left;
    background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1);
    font: 500 13.5px/1.35 var(--font-ui); color: var(--ink); cursor: pointer;
    transition: border-color var(--dur-fast) ease, background var(--dur-fast) ease, box-shadow var(--dur-base) var(--ease);
  }
  .pill-chip:hover { border-color: var(--line-strong); box-shadow: var(--shadow-2); }
  .pill-chip:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .pill-chip-icon {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: var(--ember-wash); color: var(--ember-ink);
    display: flex; align-items: center; justify-content: center;
  }

  /* One turn = the user's bubble + FirePath's card reply + follow-up chips */
  .chat-turn { display: flex; flex-direction: column; gap: 10px; animation: fp-rise var(--dur-slow) var(--ease) both; }
  .chat-bubble-user {
    align-self: flex-end; max-width: 82%; background: var(--ink); color: var(--bg);
    border-radius: 18px 18px 4px 18px; padding: 11px 16px; font-size: 14.5px; font-weight: 500; line-height: 1.45;
    overflow-wrap: anywhere;
  }

  /* Reply cards — three tones for the three answer tiers */
  .chat-card { border-radius: var(--r-lg); padding: 18px 20px; max-width: 100%; }
  @media (min-width: 768px) { .chat-card { padding: 22px 24px; } }
  .chat-card-supported { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-2); }
  .chat-card-guided { background: #FFF7F2; border: 1px solid rgba(244,98,42,0.22); }
  .chat-card-unsupported { background: var(--surface-2); border: 1px dashed var(--line-strong); }
  .chat-tag {
    display: inline-flex; align-items: center; margin-bottom: 12px; padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  }
  .chat-card-supported .chat-tag { color: var(--positive); background: var(--positive-wash); }
  .chat-card-guided .chat-tag { color: var(--ember-ink); background: var(--ember-wash); }
  .chat-card-unsupported .chat-tag { color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); }
  .chat-headline { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.35; letter-spacing: -0.005em; margin-bottom: 8px; }
  .chat-headline strong { color: var(--ember-ink); font-weight: 700; }
  .chat-body { font-size: 14.5px; color: var(--ink-2); line-height: 1.65; margin-bottom: 14px; }
  .chat-card-unsupported .chat-body { margin-bottom: 0; }
  .chat-stat-row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 12px 14px; margin-bottom: 14px;
  }
  .chat-stat-title { font-size: 14px; font-weight: 600; color: var(--ink); }
  .chat-stat-label { font-size: 12px; color: var(--ink-2); margin-top: 1px; }
  .chat-stat-value { font-size: 15px; font-weight: 600; color: var(--ink); text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums lining-nums; }
  .chat-learn-link {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 12px 14px; text-decoration: none; font-size: 13.5px; font-weight: 500; color: var(--ink);
    transition: border-color var(--dur-fast) ease, background var(--dur-fast) ease;
  }
  .chat-learn-link span:last-child { color: var(--ember-ink); flex-shrink: 0; }
  .chat-learn-link:hover { border-color: var(--ember); background: #FFF7F2; }
  .chat-learn-link:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .chat-followups { display: flex; flex-wrap: wrap; gap: 8px; }
  .chat-followups .pill-chip { align-self: auto; }

  /* Input bar — sits above the mobile tab bar (≈76px + safe area), flush at desktop */
  .chat-input-bar {
    flex-shrink: 0; display: flex; align-items: flex-end; gap: 10px;
    margin: 0 -16px; padding: 12px 16px calc(92px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--bg);
  }
  @media (min-width: 768px) { .chat-input-bar { margin: 0 -32px; padding-left: 32px; padding-right: 32px; } }
  @media (min-width: 1024px) { .chat-input-bar { margin: 0; padding: 14px 0 28px; } }
  .chat-input {
    flex: 1; min-width: 0; min-height: 48px; max-height: 100px; resize: none;
    padding: 13px 16px; border-radius: 24px; border: 1px solid var(--line-strong); background: var(--surface);
    font: 400 15px/1.4 var(--font-ui); color: var(--ink); box-shadow: var(--shadow-1);
    transition: border-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
  }
  .chat-input:focus { outline: none; border-color: var(--ember); box-shadow: 0 0 0 3px var(--ember-wash); }
  .chat-input::placeholder { color: var(--ink-3); }
  .chat-send {
    flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--ink); color: var(--bg);
    display: flex; align-items: center; justify-content: center;
    transition: opacity var(--dur-fast) ease, transform var(--dur-fast) ease;
  }
  .chat-send:not(:disabled):hover { background: #3F2C1F; }
  .chat-send:not(:disabled):active { transform: scale(0.96); }
  .chat-send:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .chat-send:disabled { opacity: 0.35; cursor: default; }
</style>
</head>
<body class="app" data-shell="app" data-active="ask">
<script src="js/shell.js"></script>

<main class="app-main ask-main">

  <header class="page-head">
    <div>
      <h1 class="page-head-title">Ask FirePath</h1>
      <p class="page-head-sub">Your AI copilot for smarter financial decisions.</p>
    </div>
  </header>

  <div class="chat-thread" id="chatThread">
    <div class="chat-starters" id="chatStarters">
      <div class="chat-starters-label eyebrow">Popular questions</div>
      <button class="pill-chip" data-q="What if I save an extra $250 a month?"><span class="pill-chip-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></span>What if I save an extra $250 a month?</button>
      <button class="pill-chip" data-q="What if I spend $150 less a week?"><span class="pill-chip-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></span>What if I spend $150 less a week?</button>
      <button class="pill-chip" data-q="What if I retire at 40?"><span class="pill-chip-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></span>What if I retire at 40?</button>
      <button class="pill-chip" data-q="What if I sell my investment property?"><span class="pill-chip-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></span>What if I sell my investment property?</button>
    </div>
  </div>

  <div class="chat-input-bar">
    <textarea class="chat-input" id="askInput" rows="1" placeholder="Ask anything about your plan…"></textarea>
    <button class="chat-send" id="askSubmit" aria-label="Send" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>

</main>

<script>
  // Answers are calculated from the person's saved profile. Signed out, or before they've
  // run the calculator, we use an example saver instead — and the answer card says so.
  const EXAMPLE = { portfolio: 520000, monthlySavings: 2600, annualSpend: 65000, age: 35, isExample: true };
  let PERSON = EXAMPLE;

  async function loadPerson() {
    try {
      const token = typeof getToken === 'function' ? getToken() : null;
      const userId = typeof getUserId === 'function' ? getUserId() : null;
      if (!token || !userId) return;
      const res = await fetch(`${WORKER_URL}/db/fp_profiles?id=eq.${userId}`, { headers: { 'Authorization': `Bearer ${token}` } });
      const rows = await res.json();
      const p = Array.isArray(rows) ? rows[0] : null;
      if (!p || !(p.freedom_number > 0) || p.savings_monthly == null) return;
      PERSON = {
        portfolio: Math.max(0, p.current_savings || 0),
        monthlySavings: Math.max(0, p.savings_monthly || 0),
        annualSpend: p.freedom_number / 25,          // the yearly spending the freedom number pays for
        age: p.age || null,
        isExample: false
      };
    } catch (e) { console.log('Profile load failed — using the example saver', e); }
  }

  function solveMonthsToTarget(startPortfolio, monthlySavings, targetSpend, rate) {
    rate = rate == null ? 0.07 : rate;
    const r = monthlyRate(rate);
    let portfolio = startPortfolio;
    for (let m = 0; m <= 40 * 12; m++) {
      if (portfolio * 0.04 >= targetSpend) return m;
      portfolio = portfolio * (1 + r) + monthlySavings;
    }
    return null;
  }
  function projectPortfolio(startPortfolio, monthlySavings, years, rate) {
    rate = rate == null ? 0.07 : rate;
    const r = monthlyRate(rate);
    let portfolio = startPortfolio;
    for (let m = 0; m < Math.round(years * 12); m++) portfolio = portfolio * (1 + r) + monthlySavings;
    return portfolio;
  }

  const baselineMonths = () => solveMonthsToTarget(PERSON.portfolio, PERSON.monthlySavings, PERSON.annualSpend);
  // "$500", "$1,500", "1.5k" → dollars
  const parseAmount = (num, k) => parseFloat(num.replace(/,/g, '')) * (k ? 1000 : 1);
  const AMOUNT = String.raw`\$?(\d[\d,]*(?:\.\d+)?)\s*(k)?`;

  // ── Classification — three tiers, matching the boundary already agreed: does a
  //    validated calculation exist for this question, not just "do we have data." ──
  const GUIDED_KEYWORDS = [
    { pattern: /propert(y|ies)|sell.*(house|home)|downsiz/i, name: 'selling or downsizing property', why: 'it requires modelling capital gains tax, selling costs, and reinvestment assumptions' },
    { pattern: /redundan|payout|severance/i, name: 'a redundancy payout', why: 'it requires modelling how a lump sum interacts with tax, timing, and your ongoing income' },
    { pattern: /child|kids?|baby|pregnan/i, name: 'having a child', why: 'it requires modelling cost-of-living changes and government payments like Family Tax Benefit' },
    { pattern: /inherit/i, name: 'an inheritance', why: 'it requires modelling how a lump sum changes your timeline alongside your existing plan' },
  ];

  function classifyAndAnswer(question) {
    const q = question.toLowerCase();

    // Guided tier — honest, specific reason, not a generic failure
    for (const g of GUIDED_KEYWORDS) {
      if (g.pattern.test(q)) {
        return { tier: 'guided', name: g.name, why: g.why };
      }
    }

    // Supported tier — savings increase
    let m = q.match(new RegExp(`save.*?${AMOUNT}\\s*(a|per)?\\s*(week|fortnight|month)`));
    if (m) {
      const amount = parseAmount(m[1], m[2]);
      const unit = m[4];
      const extraMonthly = unit === 'week' ? amount * 52 / 12 : unit === 'fortnight' ? amount * 26 / 12 : amount;
      const base = baselineMonths();
      const newMonths = solveMonthsToTarget(PERSON.portfolio, PERSON.monthlySavings + extraMonthly, PERSON.annualSpend);
      const movedBy = base != null && newMonths != null ? base - newMonths : null;
      return { tier: 'supported', type: 'savings', extraMonthly, movedBy, newMonths };
    }

    // Supported tier — spending decrease
    m = q.match(new RegExp(`spend.*?${AMOUNT}\\s*less\\s*(a|per)?\\s*(week|fortnight|month)`));
    if (m) {
      const amount = parseAmount(m[1], m[2]);
      const unit = m[4];
      const extraMonthly = unit === 'week' ? amount * 52 / 12 : unit === 'fortnight' ? amount * 26 / 12 : amount;
      const newAnnualSpend = Math.max(0, PERSON.annualSpend - extraMonthly * 12);
      const base = baselineMonths();
      const newMonths = solveMonthsToTarget(PERSON.portfolio, PERSON.monthlySavings + extraMonthly, newAnnualSpend);
      const movedBy = base != null && newMonths != null ? base - newMonths : null;
      return { tier: 'supported', type: 'spending', extraMonthly, movedBy, newMonths };
    }

    // Supported tier — retirement age target
    m = q.match(/retire.*?(\d{2})|(\d{2}).*?(retire|retirement)/);
    if (m) {
      const targetAge = parseInt(m[1] || m[2], 10);
      if (!PERSON.age) return { tier: 'unsupported' };   // can't project to an age without knowing theirs
      const yearsToTarget = targetAge - PERSON.age;
      if (yearsToTarget <= 0) return { tier: 'unsupported' };
      const projected = projectPortfolio(PERSON.portfolio, PERSON.monthlySavings, yearsToTarget);
      const income = projected * 0.04;
      const gap = PERSON.annualSpend - income;
      return { tier: 'supported', type: 'retireAge', targetAge, yearsToTarget, projected, income, gap };
    }

    return { tier: 'unsupported' };
  }

  // Escapes user-typed text before it goes into innerHTML — the question itself is
  // arbitrary input rendered straight into the thread, so this closes a real (if
  // minor, single-user) XSS gap the previous version had.
  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function movedHeadline(result) {
    if (result.movedBy == null) return `On these numbers your freedom date is still more than 40 years out.`;
    const total = Math.round(result.movedBy);
    if (total <= 0) return `That change is too small to move your freedom date meaningfully.`;
    const years = Math.floor(total / 12), months = total % 12;
    const parts = [years ? `${years} year${years > 1 ? 's' : ''}` : '', months ? `${months} month${months > 1 ? 's' : ''}` : ''].filter(Boolean);
    return `That moves your freedom date <strong>${parts.join(', ')} closer</strong>.`;
  }

  function buildCardHtml(result) {
    if (result.tier === 'supported') {
      let headline = '', body = '', statHtml = '';
      const LEARN_TOPICS = {
        savings: { title: 'The power of compounding', topic: 'compounding' },
        spending: { title: 'The real impact of annual spending', topic: 'spending' },
        retireAge: { title: 'How safe withdrawal rates work', topic: 'four-percent' },
      };
      if (result.type === 'savings') {
        headline = movedHeadline(result);
        body = result.newMonths == null
          ? `Saving an extra ${fmtDollars(result.extraMonthly)} a month helps, but on these numbers freedom is still more than 40 years away.`
          : `Saving an extra ${fmtDollars(result.extraMonthly)} a month, on top of what you're already putting away, brings your projected time to freedom down to about ${(result.newMonths / 12).toFixed(1)} years.`;
      } else if (result.type === 'spending') {
        headline = movedHeadline(result);
        body = `Spending less both reduces what you need to fund in retirement and frees up more to save today — a double effect, which is why it moves the date further than an equivalent savings increase.`;
      } else if (result.type === 'retireAge') {
        const shortfall = result.gap > 0;
        if (shortfall) {
          headline = `At age ${result.targetAge}, your portfolio would fall short by about <strong>${fmtDollars(result.gap)} a year</strong>.`;
          body = `Projecting your current savings forward ${result.yearsToTarget} years gets you to roughly ${fmtDollars(result.projected)} — enough to fund ${fmtDollars(result.income)} a year at a 4% withdrawal rate, against ${fmtDollars(PERSON.annualSpend)} you'd actually need.`;
        } else {
          headline = `Age ${result.targetAge} looks achievable on your current numbers.`;
          body = `Projecting forward ${result.yearsToTarget} years puts your portfolio around ${fmtDollars(result.projected)} — comfortably covering ${fmtDollars(PERSON.annualSpend)} a year at a 4% withdrawal rate.`;
        }
        // The mockup's "what it would take" stat callout — a real number pulled out
        // of the paragraph above, not a chart (no render pass built for that yet).
        statHtml = `
          <div class="chat-stat-row">
            <div>
              <div class="chat-stat-title">Retire at ${result.targetAge}</div>
              <div class="chat-stat-label">What it would take</div>
            </div>
            <div class="chat-stat-value">${shortfall ? 'Shortfall' : 'Buffer'} ${fmtDollars(Math.abs(result.gap))}</div>
          </div>`;
      }
      const learn = LEARN_TOPICS[result.type];
      return `
        <div class="chat-card chat-card-supported">
          <span class="chat-tag">${PERSON.isExample
            ? 'Calculated for an example saver ($520K saved, $2,600/month, $65K/yr spending, age 35) — <a href="firepath_pro.html">add your numbers</a> to see yours'
            : '✓ Calculated from your saved financial profile'}</span>
          <div class="chat-headline">${headline}</div>
          <div class="chat-body">${body}</div>
          ${statHtml}
          <a href="learning_lab.html?topic=${learn.topic}" class="chat-learn-link">
            <span>Worth exploring: ${learn.title}</span>
            <span>→</span>
          </a>
        </div>`;
    } else if (result.tier === 'guided') {
      return `
        <div class="chat-card chat-card-guided">
          <span class="chat-tag">Can't calculate this accurately yet</span>
          <div class="chat-headline">FirePath can't accurately calculate ${result.name} yet.</div>
          <div class="chat-body">That's because ${result.why}. This is a scenario we're planning to support — for now, the Scenario Explorer has a curated walkthrough for some decisions like this.</div>
          <a href="hearmeout.html" class="chat-learn-link">
            <span>Browse Scenario Explorer</span>
            <span>→</span>
          </a>
        </div>`;
    }
    return `
      <div class="chat-card chat-card-unsupported">
        <span class="chat-tag">Can't answer this yet</span>
        <div class="chat-headline">I'm not able to model that accurately from what you've asked.</div>
        <div class="chat-body">Try asking about a specific savings amount, spending change, or retirement age — those are the questions FirePath can calculate precisely today.</div>
      </div>`;
  }

  // Offers question TYPES different from the one just answered, so tapping through
  // a thread feels like exploring different levers, not repeating the same one.
  function buildFollowupsHtml(result) {
    if (result.tier !== 'supported') return '';
    const FOLLOW_UPS = {
      savings: ['What if I spend $100 less a week?', 'What if I retire at 45?'],
      spending: ['What if I save an extra $300 a month?', 'What if I retire at 50?'],
      retireAge: ['What if I save an extra $250 a month?', 'What if I spend $150 less a week?'],
    };
    const suggestions = FOLLOW_UPS[result.type] || [];
    if (!suggestions.length) return '';
    const chipIcon = '<span class="pill-chip-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg></span>';
    return `<div class="chat-followups">${suggestions.map(s => `<button class="pill-chip" data-q="${escapeHtml(s)}">${chipIcon}${escapeHtml(s)}</button>`).join('')}</div>`;
  }

  // One turn = the user's bubble plus FirePath's card reply, appended to the thread
  // and scrolled into view — this is the whole "messaging interface" behavior: every
  // question becomes a new turn instead of replacing a single answer block in place.
  function appendTurn(question, result) {
    const thread = document.getElementById('chatThread');
    const starters = document.getElementById('chatStarters');
    if (starters) starters.remove();

    const turn = document.createElement('div');
    turn.className = 'chat-turn';
    turn.innerHTML = `
      <div class="chat-bubble-user">${escapeHtml(question)}</div>
      ${buildCardHtml(result)}
      ${buildFollowupsHtml(result)}
    `;
    thread.appendChild(turn);
    wireChips(turn);
    thread.scrollTop = thread.scrollHeight;
  }

  function wireChips(scopeEl) {
    scopeEl.querySelectorAll('.pill-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const q = chip.dataset.q;
        appendTurn(q, classifyAndAnswer(q));
      });
    });
  }

  wireChips(document.getElementById('chatStarters'));

  const askInput = document.getElementById('askInput');
  const askSubmit = document.getElementById('askSubmit');

  function autoGrow() {
    askInput.style.height = 'auto';
    askInput.style.height = Math.min(askInput.scrollHeight, 100) + 'px';
  }
  function submitQuestion() {
    const q = askInput.value.trim();
    if (!q) return;
    appendTurn(q, classifyAndAnswer(q));
    askInput.value = '';
    askSubmit.disabled = true;
    autoGrow();
  }
  askInput.addEventListener('input', () => {
    askSubmit.disabled = askInput.value.trim().length === 0;
    autoGrow();
  });
  // Enter sends, Shift+Enter still makes a new line — standard messaging-app behavior.
  askInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuestion(); }
  });
  askSubmit.addEventListener('click', submitQuestion);

  // Deep-linked from Learning Lab's search ("Ask FirePath about '{query}'") — opens
  // straight into a turn instead of leaving the thread empty.
  const deepLinkQ = new URLSearchParams(window.location.search).get('q');
  loadPerson().then(() => { if (deepLinkQ) appendTurn(deepLinkQ, classifyAndAnswer(deepLinkQ)); });
</script>
</body>
</html>
