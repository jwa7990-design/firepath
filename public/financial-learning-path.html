<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Financial Learning Path — Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/app.css"/>
<script src="js/persona.js"></script>
<style>
  .flp { max-width: 640px; }
  .flp .page-head { flex-direction: column; align-items: flex-start; gap: 6px; }
  .flp .section-link { margin-bottom: 6px; }
  .flp .page-head-sub { font-size: 14px; line-height: 1.6; max-width: 52ch; }
  .mockup-tag { margin-bottom: 2px; }

  /* ── Quiz ── */
  .progress-dots { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong); transition: background var(--dur-base) var(--ease), transform var(--dur-base) var(--ease); }
  .dot.active { background: var(--ember); transform: scale(1.25); }
  .dot.done { background: var(--amber); }
  .question-card { padding: 24px 20px; }
  @media (min-width: 768px) { .question-card { padding: 32px 28px; } }
  .question-text { font-family: var(--font-display); font-size: 21px; font-weight: 700; margin-bottom: 20px; line-height: 1.3; color: var(--ink); letter-spacing: -0.005em; }
  .option-btn {
    display: block; width: 100%; min-height: 50px; text-align: left; margin-bottom: 10px; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-md);
    font: 500 14.5px/1.4 var(--font-ui); color: var(--ink); cursor: pointer;
    transition: border-color var(--dur-fast) ease, background var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
  }
  .option-btn:hover { border-color: var(--ember); background: #FFF7F2; }
  .option-btn:focus-visible { outline: none; border-color: var(--ember); box-shadow: 0 0 0 3px var(--ember-wash); }
  .back-link { display: inline-block; margin-top: 10px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); text-decoration: none; cursor: pointer; }
  .back-link:hover { color: var(--ember-ink); }

  /* ── Results ── */
  .results-header { margin-bottom: 24px; }
  .results-header .eyebrow { color: var(--ember-ink); margin-bottom: 8px; }
  .results-header h2 { font-family: var(--font-display); font-size: clamp(24px, 4vw, 28px); font-weight: 700; margin-bottom: 10px; line-height: 1.25; color: var(--ink); letter-spacing: -0.01em; }
  .results-header p { font-size: 14px; color: var(--ink-2); line-height: 1.65; }

  .confidence-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; margin-bottom: 12px; }
  .confidence-badge.high { background: var(--positive-wash); color: var(--positive); }
  .confidence-badge.review { background: rgba(58,110,165,0.12); color: var(--blue); }
  .confidence-badge.maybe { background: var(--ember-wash); color: var(--ember-ink); }
  .confidence-badge.low { background: var(--surface-2); color: var(--ink-2); }

  .category-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 28px 0 12px; }
  .category-label:first-of-type { margin-top: 0; }
  .result-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: 20px; margin-bottom: 12px; }
  @media (min-width: 768px) { .result-item { padding: 24px; } }
  .result-item.dimmed { opacity: 0.6; box-shadow: none; }
  .result-title { font-family: var(--font-display); font-size: 18px; font-weight: 700; line-height: 1.3; margin-bottom: 14px; color: var(--ink); }
  .result-title span { font-family: var(--font-ui); color: var(--ink-2) !important; font-size: 12px !important; }
  .result-section { margin-bottom: 14px; }
  .result-label { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); margin-bottom: 4px; }
  .result-text { font-size: 14px; color: var(--ink-2); line-height: 1.65; }
  .trigger-list { margin-top: 8px; }
  .trigger-item { font-size: 12.5px; color: var(--positive); font-weight: 500; margin-bottom: 3px; }
  .outcome-list { margin: 4px 0 0 18px; padding: 0; }
  .outcome-list li { font-size: 14px; color: var(--ink-2); line-height: 1.6; margin-bottom: 3px; }
  .result-link { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 500; color: var(--ember-ink); text-decoration: none; margin-top: 4px; }
  .result-link:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* Roadmap — the page's one dark "earned" surface */
  .roadmap-box { background: linear-gradient(140deg, var(--espresso), var(--espresso-2)); border-radius: var(--r-lg); box-shadow: var(--shadow-2); padding: 24px 20px; color: var(--bg); margin: 32px 0 16px; }
  @media (min-width: 768px) { .roadmap-box { padding: 28px; } }
  .roadmap-box h3 { font-family: var(--font-display); font-size: 21px; font-weight: 700; margin-bottom: 4px; }
  .roadmap-box .roadmap-sub { font-size: 13px; opacity: 0.75; margin-bottom: 16px; }
  .roadmap-box > div[style*="height:6px"] > div { background: linear-gradient(90deg, var(--ember), var(--amber)) !important; }
  .roadmap-tier-label { font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; color: rgba(253,246,238,0.6); margin: 14px 0 8px; }
  .roadmap-tier-label:first-of-type { margin-top: 0; }
  .roadmap-arrow { text-align: center; font-size: 14px; opacity: 0.5; margin: 4px 0; }
  .roadmap-item { display: flex; align-items: center; gap: 10px; background: rgba(253,246,238,0.07); border: 1px solid rgba(253,246,238,0.08); border-radius: var(--r-sm); padding: 11px 12px; margin-bottom: 8px; font-size: 13.5px; transition: background var(--dur-fast) ease; }
  .roadmap-item[onclick]:hover { background: rgba(253,246,238,0.12); }
  .roadmap-num { width: 20px; height: 20px; border-radius: 50%; background: var(--ember); color: #fff; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .roadmap-time { margin-left: auto; font-size: 12px; opacity: 0.65; text-align: right; flex-shrink: 0; max-width: 45%; font-variant-numeric: tabular-nums; }
  .roadmap-progress { font-size: 12.5px; margin-top: 14px; opacity: 0.75; font-variant-numeric: tabular-nums; }

  .caveat { margin: 20px 0 8px; font-size: 12.5px; text-align: center; font-style: italic; }
  .restart-btn { margin-top: 16px; }
</style>
</head>
<body class="app" data-shell="app" data-active="learn">
<script src="js/shell.js"></script>

<main class="app-main flp">
  <header class="page-head">
    <a href="learn.html" class="section-link">← Learn</a>
    <div class="mockup-tag eyebrow">Mockup — Financial Learning Path</div>
  </header>
  <div id="quizView">
    <h1 class="page-head-title">What's worth exploring?</h1>
    <p class="page-head-sub subtitle" style="margin-bottom:24px;">A few quick questions to see which topics are worth learning about. No numbers calculated, no advice given — just relevant education pointed your way.</p>
    <div class="progress-dots" id="progressDots"></div>
    <div class="question-card card" id="questionCard"></div>
  </div>

  <div id="resultsView" style="display:none;"></div>
</main>

<!-- auth.js provides getToken()/getUserId()/WORKER_URL — same pattern as journey.html and tax.html.
     calculations.js is included for consistency with those pages but isn't required by this file's own logic.
     Without auth.js, persistence silently no-ops and the page behaves exactly as before: quiz every time, no saved progress. -->
<script src="js/auth.js"></script>
<script src="js/calculations.js"></script>

<script>
const QUESTIONS = [
  {
    key: 'employment',
    text: "Do you work for someone else, or for yourself?",
    options: [
      { label: 'I work for an employer', value: 'employee' },
      { label: "I'm self-employed / a business owner", value: 'self' },
    ],
  },
  {
    key: 'shares',
    text: "Do you own shares or ETFs outside super?",
    options: [
      { label: 'Yes', value: 'yes' },
      { label: 'No', value: 'no' },
      { label: "I'm not sure", value: 'not_sure' },
    ],
  },
  {
    key: 'property',
    text: "Do you own an investment property?",
    options: [
      { label: 'Yes', value: 'yes' },
      { label: 'No', value: 'no' },
    ],
  },
  {
    key: 'salarySacrifice',
    text: "Do you currently salary sacrifice into super?",
    options: [
      { label: 'Yes', value: 'yes' },
      { label: 'No', value: 'no' },
      { label: "I'm not sure", value: 'not_sure' },
    ],
  },
  {
    key: 'partner',
    text: "Do you have a partner or spouse?",
    options: [
      { label: 'Yes', value: 'yes' },
      { label: 'No', value: 'no' },
    ],
  },
  {
    key: 'privateHealth',
    text: "Do you have private hospital cover in your health insurance?",
    options: [
      { label: 'Yes', value: 'yes' },
      { label: 'No', value: 'no' },
    ],
  },
  {
    key: 'super',
    text: "Roughly, what's your super balance?",
    options: [
      { label: 'Under $500,000', value: 'under500k' },
      { label: '$500,000 or more', value: 'over500k' },
      { label: "I'm not sure", value: 'not_sure' },
    ],
  },
  {
    key: 'income',
    text: "Last one — roughly, what's your income bracket?",
    options: [
      { label: 'Under $60,000', value: 'under60k' },
      { label: '$60,000 – $100,000', value: '60to100k' },
      { label: '$100,000+', value: 'over100k' },
      { label: "I'm not sure", value: 'not_sure' },
    ],
  },
  {
    key: 'advisor',
    text: "Have you spoken with a financial adviser or accountant about this before?",
    options: [
      { label: 'Yes', value: 'yes' },
      { label: 'No', value: 'no' },
    ],
  },
];

let currentQ = 0;
const answers = {};
const completedTopics = new Set();
let checkingItem = null;

function toggleRoadmapItem(title) {
  if (completedTopics.has(title)) {
    completedTopics.delete(title);
  } else {
    completedTopics.add(title);
  }
  saveProgress();
  showResults();
}

function startComprehensionCheck(title) {
  checkingItem = title;
  showResults();
}

function answerComprehension(title, understood) {
  checkingItem = null;
  if (understood) {
    completedTopics.add(title);
  }
  saveProgress();
  showResults();
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  document.getElementById('progressDots').innerHTML = QUESTIONS.map((_, i) =>
    `<div class="dot ${i === currentQ ? 'active' : i < currentQ ? 'done' : ''}"></div>`
  ).join('');

  document.getElementById('questionCard').innerHTML = `
    <div class="question-text">${q.text}</div>
    ${q.options.map(opt => `<button class="option-btn" onclick="selectAnswer('${q.key}','${opt.value}')">${opt.label}</button>`).join('')}
    ${currentQ > 0 ? '<a class="back-link" onclick="goBack()">← Back</a>' : ''}
  `;
}

function selectAnswer(key, value) {
  answers[key] = value;
  if (currentQ < QUESTIONS.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    saveProgress();
    showResults();
  }
}

function goBack() {
  if (currentQ > 0) {
    currentQ--;
    renderQuestion();
  }
}

function confidenceBadge(level) {
  if (level === 'new') return `<span class="confidence-badge high">🟢 New opportunity — you may not be using this yet</span>`;
  if (level === 'review') return `<span class="confidence-badge review">🔵 Worth reviewing — you may already be using this</span>`;
  if (level === 'maybe') return `<span class="confidence-badge maybe">🟡 May be worth exploring</span>`;
  return `<span class="confidence-badge low">⚪ Unlikely to apply</span>`;
}

function showResults() {
  document.getElementById('quizView').style.display = 'none';
  const resultsView = document.getElementById('resultsView');
  resultsView.style.display = 'block';

  const cards = [];

  // ── Salary sacrifice ──
  const ssLevel = answers.salarySacrifice === 'no' ? 'new' : answers.salarySacrifice === 'not_sure' ? 'maybe' : 'review';
  cards.push({
    title: 'Salary sacrifice explained',
    proHref: 'tax.html?highlight=tool2',
    atoUrl: 'https://www.ato.gov.au/individuals-and-families/super-for-individuals-and-families/super/growing-and-keeping-track-of-your-super/how-to-save-more-in-your-super/salary-sacrificing-super',
    category: 'Super',
    tier: 'Foundations',
    level: ssLevel,
    triggers: answers.salarySacrifice === 'yes' ? [] : [
      answers.salarySacrifice === 'no' ? "You said you don't currently salary sacrifice" : "You weren't sure if you salary sacrifice",
    ],
    suggestedBecause: answers.salarySacrifice === 'no' ? "You told us you don't currently salary sacrifice. Many employees explore this because it can change how super contributions and taxable income interact." : answers.salarySacrifice === 'not_sure' ? "You weren't sure whether you salary sacrifice. Worth clarifying, since it directly affects your taxable income and super growth." : "You told us you already salary sacrifice. Still worth understanding the full mechanics, including the cap it counts toward.",
    afterReading: ['how salary sacrifice actually works', 'who is generally eligible', 'where the trade-offs against accessibility are'],
    whyMatters: 'This concept can affect how much tax some Australians pay and how quickly their super grows.',
    readingMin: 8,
    link: '/learn/salary-sacrifice-explained.html',
  });

  // ── Catch-up concessional contributions ──
  const cuLevel = answers.super === 'under500k' ? 'new' : answers.super === 'not_sure' ? 'maybe' : 'low';
  cards.push({
    title: 'Catch-up concessional contributions',
    atoUrl: 'https://www.ato.gov.au/individuals-and-families/super-for-individuals-and-families/super/growing-and-keeping-track-of-your-super/caps-limits-and-tax-on-super-contributions/concessional-contributions-cap',
    category: 'Super',
    tier: 'Super',
    level: cuLevel,
    triggers: answers.super === 'under500k' ? ['Your super balance is under $500,000']
      : answers.super === 'not_sure' ? ["You weren't sure of your super balance"] : [],
    suggestedBecause: answers.super === 'under500k' ? "You told us your super balance is under $500,000 — the threshold that determines whether unused prior-year contribution cap is available to you." : answers.super === 'not_sure' ? "You weren't sure of your super balance. This threshold is worth checking, since it determines eligibility for this strategy." : "Your super balance appears to be over the $500,000 threshold this generally requires.",
    afterReading: ['how unused concessional cap from recent years can be used', 'who is generally eligible', 'why the $500,000 threshold matters'],
    whyMatters: 'This can let some people contribute well above the standard cap in a single year, meaningfully boosting super at a lower tax rate.',
    readingMin: 10,
    prereq: 'Salary sacrifice explained',
    link: '/learn/catch-up-contributions.html',
  });

  // ── Spouse contribution offset ──
  const spLevel = answers.partner === 'yes' ? 'new' : 'low';
  cards.push({
    title: 'Spouse contribution offset',
    atoUrl: 'https://www.ato.gov.au/individuals-and-families/super-for-individuals-and-families/super/growing-and-keeping-track-of-your-super/how-to-save-more-in-your-super/spouse-super-contributions',
    category: 'Family',
    tier: 'Super',
    level: spLevel,
    triggers: answers.partner === 'yes' ? ['You have a partner or spouse'] : [],
    suggestedBecause: answers.partner === 'yes' ? "You told us you have a partner. This may be relevant if one of you earns significantly less and could benefit from a contribution." : "This generally only applies to couples, which doesn't appear to match your situation.",
    afterReading: ['how contributing to a partner\'s super can generate a tax offset', 'the income thresholds involved', 'why this only applies to couples'],
    whyMatters: 'This can reduce your own tax while directly building your partner\'s retirement savings.',
    readingMin: 6,
    link: '/learn/spouse-contribution-offset.html',
  });

  // ── Franking credits ──
  const frLevel = answers.shares === 'yes' ? 'review' : answers.shares === 'not_sure' ? 'maybe' : 'low';
  cards.push({
    title: 'Franking credits on Australian shares',
    atoUrl: 'https://www.ato.gov.au/individuals-and-families/investments-and-assets/shares-funds-and-trusts/investing-in-shares/refund-of-franking-credits-for-individuals',
    category: 'Investing',
    tier: 'Investing',
    level: frLevel,
    triggers: answers.shares === 'yes' ? ['You own shares or ETFs outside super']
      : answers.shares === 'not_sure' ? ["You weren't sure if you own shares outside super"] : [],
    suggestedBecause: answers.shares === 'yes' ? "You told us you own shares or ETFs outside super. Australian investors often explore franking credits because they affect how dividends are actually taxed." : answers.shares === 'not_sure' ? "You weren't sure if you own shares outside super. Worth checking, since this affects how any dividends you receive are taxed." : "This applies specifically to Australian share ownership outside super, which doesn't appear to match your situation.",
    afterReading: ['how Australia\'s imputation tax system works', 'why franked dividends can beat the headline yield', 'how this differs from international shares'],
    whyMatters: 'This can meaningfully change the real, after-tax return on Australian share investments.',
    readingMin: 7,
    link: '/learn/franking-credits-australia.html',
  });

  // ── Government co-contribution ──
  const coLevel = answers.income === 'under60k' ? 'new' : answers.income === 'not_sure' ? 'maybe' : 'low';
  cards.push({
    title: 'Government super co-contribution',
    atoUrl: 'https://www.ato.gov.au/individuals-and-families/super-for-individuals-and-families/super/growing-and-keeping-track-of-your-super/how-to-save-more-in-your-super/government-super-contributions/super-co-contribution',
    category: 'Super',
    tier: 'Super',
    level: coLevel,
    triggers: answers.income === 'under60k' ? ['Your income bracket is under $60,000']
      : answers.income === 'not_sure' ? ["You weren't sure of your income bracket"] : [],
    suggestedBecause: answers.income === 'under60k' ? "You told us your income is under $60,000 — the general range the government's co-contribution scheme is designed for." : answers.income === 'not_sure' ? "You weren't sure of your income bracket. This scheme has a specific income cutoff worth checking against." : "This scheme generally applies at lower incomes than you indicated.",
    afterReading: ['how the government matches personal super contributions', 'who is generally eligible by income', 'how much the match is worth'],
    whyMatters: 'This is effectively free money added to super for eligible lower and middle income earners.',
    readingMin: 6,
    link: '/learn/super-co-contribution.html',
  });

  // ── Medicare Levy Surcharge ──
  const mlsLevel = answers.privateHealth === 'no' && answers.income === 'over100k' ? 'new' : answers.privateHealth === 'no' ? 'maybe' : 'low';
  cards.push({
    title: 'Medicare Levy Surcharge',
    atoUrl: 'https://www.ato.gov.au/individuals-and-families/medicare-and-private-health-insurance/medicare-levy-surcharge',
    category: 'Tax',
    tier: 'Advanced',
    level: mlsLevel,
    triggers: answers.privateHealth === 'no' ? ["You don't currently have private health cover",
      ...(answers.income === 'over100k' ? ['Your income bracket is $100,000+'] : [])] : [],
    suggestedBecause: (answers.privateHealth === 'no' && answers.income === 'over100k') ? "You told us you don't have private health cover and your income is $100,000+ — exactly the combination that determines whether this surcharge applies." : answers.privateHealth === 'no' ? "You told us you don't have private health cover. Whether the surcharge applies also depends on your income bracket." : "You told us you already have private health cover, which generally avoids this surcharge.",
    afterReading: ['how the surcharge works', 'the income thresholds involved', 'how private health cover interacts with it'],
    whyMatters: 'This can be an avoidable extra cost each year depending on income and private health cover decisions.',
    readingMin: 9,
    link: '/learn/tax-and-investing-australia.html',
  });

  const order = { new: 0, review: 1, maybe: 2, low: 3 };
  const CATEGORY_ORDER = ['Super', 'Investing', 'Family', 'Tax'];
  const grouped = {};
  cards.forEach(c => {
    if (!grouped[c.category]) grouped[c.category] = [];
    grouped[c.category].push(c);
  });
  Object.keys(grouped).forEach(cat => grouped[cat].sort((a, b) => order[a.level] - order[b.level]));

  let roadmapItems = cards.filter(c => c.level !== 'low').sort((a, b) => order[a.level] - order[b.level]);
  // Respect prerequisites: an item with a prereq must come after the item it builds on, within the same tier
  roadmapItems.sort((a, b) => {
    if (a.prereq === b.title) return 1;
    if (b.prereq === a.title) return -1;
    return 0;
  });
  const TIER_ORDER = ['Foundations', 'Super', 'Investing', 'Advanced'];
  const completedCount = roadmapItems.filter(item => completedTopics.has(item.title)).length;

  resultsView.innerHTML = `
    <div class="results-header">
      <div class="eyebrow">Nothing here is a recommendation</div>
      <h2>${roadmapItems.length} financial topics worth exploring</h2>
      <p>Based on your answers, FirePath matched your profile against our library of educational topics and highlighted the concepts that may be relevant to learn about. Some may apply to you, some may not. Each article explains how the concept works, who it's generally designed for, and where to find official guidance.</p>
    </div>
    ${CATEGORY_ORDER.filter(cat => grouped[cat]).map(cat => `
      <div class="category-label">${cat}</div>
      ${grouped[cat].map(c => `
        <div class="result-item ${c.level === 'low' ? 'dimmed' : ''}">
          ${confidenceBadge(c.level)}
          <div class="result-title">${c.title} <span style="font-size:12px;font-weight:400;color:var(--ink-2);">— ${c.readingMin} min read</span></div>
          <div class="result-section">
            <div class="result-label">Why FirePath suggested this topic</div>
            <div class="result-text">${c.suggestedBecause}</div>
          </div>
          <div class="result-section">
            <div class="result-label">After reading this you'll understand</div>
            <ul class="outcome-list">${c.afterReading.map(o => `<li>${o}</li>`).join('')}</ul>
          </div>
          ${c.whyMatters ? `<div class="result-section"><div class="result-label">Why this matters</div><div class="result-text">${c.whyMatters}</div></div>` : ''}
          ${c.prereq ? `<div style="font-size:12.5px;color:var(--ink-2);font-style:italic;margin-bottom:10px;">Builds on: ${c.prereq}</div>` : ''}
          <a class="result-link" href="${c.link}">Read in Learning Lab →</a>
          ${c.proHref ? `<br/><a class="result-link" href="${c.proHref}" style="margin-top:6px;">Ready to see how this works with your own situation? Try it in Tax & Strategy →</a>` : ''}
          ${c.atoUrl ? `<br/><a class="result-link" href="${c.atoUrl}" target="_blank" rel="noopener" style="margin-top:6px;color:var(--ink-2);">Official source: Australian Taxation Office →</a>` : ''}
        </div>
      `).join('')}
    `).join('')}

    ${roadmapItems.length ? `
    <div class="roadmap-box">
      <h3>Your learning roadmap</h3>
      <div class="roadmap-sub">Structured like a course — complete a topic to unlock what builds on it</div>
      <div style="background:rgba(255,255,255,0.15);border-radius:5px;height:6px;overflow:hidden;margin-bottom:6px;">
        <div style="background:white;height:100%;width:${roadmapItems.length ? Math.round((completedCount/roadmapItems.length)*100) : 0}%;transition:width 0.3s;"></div>
      </div>
      <div style="font-size:11.5px;opacity:0.85;margin-bottom:14px;">${completedCount} of ${roadmapItems.length} topics in this path completed${completedCount === 0 ? ' — just starting' : completedCount === roadmapItems.length ? ' — path complete' : ' — making progress'}</div>
      ${TIER_ORDER.filter(tier => roadmapItems.some(item => item.tier === tier)).map((tier, tIdx, tiers) => `
        <div class="roadmap-tier-label">${tier.toUpperCase()}</div>
        ${roadmapItems.filter(item => item.tier === tier).map(item => {
          const done = completedTopics.has(item.title);
          const locked = item.prereq && !completedTopics.has(item.prereq) && roadmapItems.some(ri => ri.title === item.prereq);
          const checking = checkingItem === item.title;
          if (locked) {
            return `
          <div class="roadmap-item" style="opacity:0.5;cursor:default;">
            <span>🔒</span>
            <span>${item.title}</span>
            <span class="roadmap-time">Complete "${item.prereq}" first</span>
          </div>`;
          }
          if (checking) {
            return `
          <div class="roadmap-item" style="flex-direction:column;align-items:stretch;background:rgba(255,255,255,0.2);">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;"><span>○</span><span>${item.title}</span></div>
            <div style="font-size:12px;margin-bottom:8px;">Do you understand this now?</div>
            <div style="display:flex;gap:6px;">
              <button onclick="event.stopPropagation();answerComprehension('${item.title.replace(/'/g, "\\'")}', false)" style="flex:1;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;border-radius:8px;padding:6px;font-size:11px;cursor:pointer;">Not yet</button>
              <button onclick="event.stopPropagation();answerComprehension('${item.title.replace(/'/g, "\\'")}', true)" style="flex:1;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:white;border-radius:8px;padding:6px;font-size:11px;cursor:pointer;">Mostly</button>
              <button onclick="event.stopPropagation();answerComprehension('${item.title.replace(/'/g, "\\'")}', true)" style="flex:1;background:white;border:1px solid white;color:var(--ember-ink);border-radius:8px;padding:6px;font-size:11px;font-weight:600;cursor:pointer;">Yes</button>
            </div>
          </div>`;
          }
          return `
          <div class="roadmap-item" onclick="${done ? `toggleRoadmapItem('${item.title.replace(/'/g, "\\'")}')` : `startComprehensionCheck('${item.title.replace(/'/g, "\\'")}')`}" style="cursor:pointer;${done ? 'opacity:0.6;' : ''}">
            <span>${done ? '✓' : '🔓'}</span>
            <span style="${done ? 'text-decoration:line-through;' : ''}">${item.title}${item.prereq ? ` <span style="opacity:0.7;font-size:11px;">(builds on ${item.prereq})</span>` : ''}</span>
            <span class="roadmap-time">${item.readingMin} min</span>
          </div>`;
        }).join('')}
        ${tIdx < tiers.length - 1 ? '<div class="roadmap-arrow">↓</div>' : ''}
      `).join('')}
      <div class="roadmap-progress">Progress: ${completedCount} of ${roadmapItems.length} completed</div>
    </div>
    ` : ''}

    <div class="caveat callout">Based on the information you've provided, these are educational topics that may be relevant to explore. FirePath has not assessed whether any strategy is suitable or available to you. ${answers.advisor === 'no' ? 'For decisions specific to your situation, a registered tax agent or financial adviser can confirm what genuinely applies to you.' : ''}</div>
    <button class="restart-btn btn btn-quiet btn-lg btn-block" onclick="retakeQuiz()">Retake the quiz</button>
  `;
}

// ── Persistence: check for a saved profile before starting the quiz ──
// Only activates for logged-in users (fpToken/fpUserId present). Anonymous visitors
// still get the full free, no-signup quiz experience exactly as before — this only
// adds a "remember me" layer on top for people who happen to be signed in.
const fpToken = typeof getToken === 'function' ? getToken() : null;
const fpUserId = typeof getUserId === 'function' ? getUserId() : null;
let saveTimer;

async function loadSavedProgress() {
  if (!fpToken || !fpUserId) { renderQuestion(); return; }
  try {
    const res = await fetch(`${WORKER_URL}/db/financial_learning_progress?user_id=eq.${fpUserId}`, {
      headers: { 'Authorization': `Bearer ${fpToken}` }
    });
    const data = await res.json();
    if (Array.isArray(data) && data.length > 0 && data[0].answers && Object.keys(data[0].answers).length > 0) {
      Object.assign(answers, data[0].answers);
      (data[0].completed_topics || []).forEach(t => completedTopics.add(t));
      showResults();
      return;
    }
  } catch(e) { console.log('No saved progress found, starting fresh', e); }
  renderQuestion();
}

function saveProgress() {
  if (!fpToken || !fpUserId) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await fetch(`${WORKER_URL}/db/financial_learning_progress`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${fpToken}`, 'Prefer': 'resolution=merge-duplicates' },
        body: JSON.stringify({
          user_id: fpUserId,
          answers: answers,
          completed_topics: Array.from(completedTopics),
          updated_at: new Date().toISOString()
        })
      });
    } catch(e) { console.log('Progress save failed', e); }
  }, 800);
}

function retakeQuiz() {
  if (!confirm('This clears your saved answers and progress. Retake the quiz from the start?')) return;
  Object.keys(answers).forEach(k => delete answers[k]);
  completedTopics.clear();
  currentQ = 0;
  if (fpToken && fpUserId) {
    fetch(`${WORKER_URL}/db/financial_learning_progress`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${fpToken}`, 'Prefer': 'resolution=merge-duplicates' },
      body: JSON.stringify({ user_id: fpUserId, answers: {}, completed_topics: [], updated_at: new Date().toISOString() })
    }).catch(e => console.log('Reset save failed', e));
  }
  document.getElementById('resultsView').style.display = 'none';
  document.getElementById('quizView').style.display = 'block';
  renderQuestion();
}

loadSavedProgress();
</script>
<script src="js/quick-feedback-widget.js"></script>
</body>
