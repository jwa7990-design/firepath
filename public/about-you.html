<style>
  .about-wrap { max-width: 720px; }
  .section-block { margin-bottom: 16px; }
  .block-note { font-size: 12.5px; color: var(--ink-2); margin-top: 12px; line-height: 1.55; }

  .achv-strip { display: flex; gap: 10px; overflow-x: auto; padding: 2px 0 4px; }
  .achv-badge { flex-shrink: 0; width: 80px; text-align: center; }
  .achv-icon-wrap {
    width: 54px; height: 54px; margin: 0 auto 8px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; background: var(--surface-2); border: 1px solid var(--line-strong);
  }
  .achv-badge.unlocked .achv-icon-wrap { background: linear-gradient(135deg, var(--ember), var(--amber)); border-color: transparent; }
  .achv-icon-wrap svg { width: 20px; height: 20px; color: var(--ink-3); }
  .achv-badge.unlocked .achv-icon-wrap svg { color: #fff; }
  .achv-label { font-size: 11.5px; color: var(--ink-2); line-height: 1.3; }
  .achv-badge.unlocked .achv-label { color: var(--ink); font-weight: 500; }
  .achv-badge.next .achv-icon-wrap { border: 1.5px dashed var(--ember); background: var(--ember-wash); }
  .achv-badge.next .achv-icon-wrap svg { color: var(--ember-ink); }
  .achv-badge.next .achv-label { color: var(--ember-ink); font-weight: 500; }
  .achv-distance { font-size: 11px; color: var(--ember-ink); font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .timeline { position: relative; padding-left: 24px; }
  .timeline::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1.5px; background: var(--line-strong); }
  .tl-item { position: relative; padding-bottom: 20px; }
  .tl-item:last-child { padding-bottom: 0; }
  .tl-dot { position: absolute; left: -24px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line-strong); }
  .tl-item.done .tl-dot { background: var(--ember); border-color: var(--ember); }
  .tl-item.next .tl-dot { border-color: var(--ember); border-style: dashed; }
  .tl-label { font-size: 14px; line-height: 1.45; }
  .tl-item.done .tl-label { color: var(--ink); font-weight: 500; }
  .tl-item:not(.done) .tl-label { color: var(--ink-2); }
  .tl-item.next .tl-label { color: var(--ember-ink); font-weight: 500; }
  .tl-distance { font-size: 12px; color: var(--ember-ink); font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; }

  .dna-type { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; color: var(--ink); margin-bottom: 14px; }
  .dna-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .dna-label { width: 100px; flex-shrink: 0; font-size: 13.5px; color: var(--ink-2); }
  .dna-track { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .dna-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--ember), var(--amber)); }

  .empty-state { text-align: center; padding: 48px 20px; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
  .empty-state a { color: var(--ember-ink) !important; font-weight: 500; }
</style>
</head>
<body class="app" data-shell="app" data-active="journey">
<script src="js/shell.js"></script>

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <symbol id="icon-flame-badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4.5 0 7.5-3 7.5-6.8 0-3-1.8-4.9-3-6.3.2 1.6-.5 2.7-1.3 3.3.3-2.7-1-5.4-3.4-7.2-.4 2.2-1.4 3.6-2.9 5C7.2 11.6 6 12.9 6 15.2 6 19 7.5 22 12 22z"/></symbol>
    <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></symbol>
  </defs>
</svg>

<main class="app-main">
<div class="about-wrap">

  <header class="page-head rise" style="--i:0">
    <div>
      <a href="journey.html" class="section-link">← Your Path</a>
      <h1 class="page-head-title" style="margin-top:8px;">About you</h1>
      <p class="page-head-sub">Milestones you've reached, what's next, and how you handle money.</p>
    </div>
  </header>

  <div id="loadingState" class="card empty-state">Loading...</div>

  <div id="content" style="display:none;">
    <section class="card section-block">
      <div class="section-head"><h2 class="section-label">Achievements</h2></div>
      <div class="achv-strip" id="achvStrip"></div>
      <div class="block-note" id="achvNote"></div>
    </section>
    <section class="card section-block">
      <div class="section-head"><h2 class="section-label">Your timeline</h2></div>
      <div class="timeline" id="timeline"></div>
    </section>
    <section class="card section-block">
      <div class="section-head"><h2 class="section-label">How you handle money</h2></div>
      <div class="dna-type" id="dnaType"></div>
      <div id="dnaRows"></div>
      <div class="block-note" id="dnaNote"></div>
    </section>
  </div>

</div>
</main>

<script>

  const PERSONA_COPY = {
    beginner: {
      badgeCoast: 'Halfway cushion', badgeLean: 'Covers the basics', badgeFI: 'Work becomes optional',
      tlCoast: 'Saved enough that growth alone could carry you one day (rough estimate)',
      tlLean: 'Close to covering your basic living costs without working (rough estimate)',
      tlFI: 'Enough saved that work is optional',
      note: 'A rough guide based on your savings compared with your freedom number. It’s not an exact calculation yet.'
    },
    default: {
      badgeCoast: 'Coast FIRE reached', badgeLean: 'Lean FIRE', badgeFI: 'Work is optional',
      tlCoast: 'Reached Coast FIRE (rough estimate)', tlLean: 'Reached Lean FIRE (rough estimate)',
      tlFI: 'Hit your freedom number',
      note: 'Based on your savings compared with your freedom number. It’s a rough guide, not the full Coast/Lean FIRE sum yet.'
    }
  };

  function scoreSaver(savingsRate) {
    if (!savingsRate) return 1;
    return Math.max(1, Math.min(10, Math.round(savingsRate / 5)));
  }
  function scoreInvestor(savingsType) {
    // Keys are the values onboarding actually stores in savings_type.
    const map = { etfs: 9, mix: 6, offset: 4, cash: 2 };
    return map[(savingsType || '').toLowerCase()] || 4;
  }
  function scoreRisk(debtTotal, mortgageRemaining, grossIncome) {
    const leverage = debtTotal + mortgageRemaining;
    if (!grossIncome || grossIncome <= 0) return leverage > 0 ? 6 : 2;
    const ratio = leverage / grossIncome;
    return Math.max(1, Math.min(10, Math.round(ratio * 2)));
  }
  function scoreSpending(retirementSpendMultiplier) {
    const m = retirementSpendMultiplier || 0.8;
    return Math.max(1, Math.min(10, Math.round(m * 10)));
  }

  function renderFinancialDNA(p) {
    const saverScore = scoreSaver(p.savings_rate);
    const investorScore = scoreInvestor(p.savings_type);
    const rows = [
      { label: 'Saver', score: saverScore },
      { label: 'Investor', score: investorScore },
      { label: 'Risk taken', score: scoreRisk(p.debt_total || 0, p.mortgage_remaining || 0, p.gross_income || (p.take_home_income > 0 ? estimateGrossFromNet(p.take_home_income * 12) : 0)) },
      { label: 'Spending', score: scoreSpending(p.retirement_spend_multiplier) }
    ];
    document.getElementById('dnaRows').innerHTML = rows.map(r => `
      <div class="dna-row">
        <div class="dna-label">${r.label}</div>
        <div class="dna-track"><div class="dna-fill" style="width:${r.score*10}%"></div></div>
      </div>`).join('');

    let dnaType = 'The Steady Starter';
    if (saverScore >= 7 && investorScore >= 7) dnaType = 'The All-Rounder';
    else if (saverScore >= 7) dnaType = 'The Quiet Builder';
    else if (investorScore >= 7) dnaType = 'The Investor';
    document.getElementById('dnaType').textContent = dnaType;
    document.getElementById('dnaNote').textContent = "A rough score from your saved numbers. It doesn’t count pay rises yet, because we don’t keep your history.";
  }

  function renderAchievementsAndTimeline(savings, freedomNumber, persona){
    const copy = PERSONA_COPY[persona] || PERSONA_COPY.default;
    const ratio = freedomNumber > 0 ? savings / freedomNumber : 0;
    const badges = [
      { label: 'First $10k',    unlocked: savings >= 10000, target: 10000 },
      { label: 'First six figures',   unlocked: savings >= 100000, target: 100000 },
      { label: 'Quarter free', unlocked: ratio >= 0.25, target: freedomNumber * 0.25 },
      { label: copy.badgeCoast, unlocked: ratio >= 0.4, target: freedomNumber * 0.4 },
      { label: copy.badgeLean,  unlocked: ratio >= 0.7, target: freedomNumber * 0.7 },
      { label: copy.badgeFI,    unlocked: ratio >= 1.0, target: freedomNumber }
    ];
    const nextBadgeIdx = badges.findIndex(b => !b.unlocked);
    document.getElementById('achvNote').textContent = copy.note;
    document.getElementById('achvStrip').innerHTML = badges.map((b, i) => {
      const isNext = i === nextBadgeIdx;
      const remaining = isNext ? Math.max(0, b.target - savings) : 0;
      return `
      <div class="achv-badge ${b.unlocked?'unlocked':''} ${isNext?'next':''}">
        <div class="achv-icon-wrap"><svg><use href="#${b.unlocked?'icon-flame-badge':'icon-lock'}"/></svg></div>
        <div class="achv-label">${b.label}</div>
        ${isNext && remaining > 0 ? `<div class="achv-distance">${fmtM(remaining)} away</div>` : ''}
      </div>`;
    }).join('');

    const timeline = [
      { label: 'Started FirePath', done: true, target: 0 },
      { label: 'Saved first $100k', done: savings >= 100000, target: 100000 },
      { label: copy.tlCoast, done: ratio >= 0.4, target: freedomNumber * 0.4 },
      { label: copy.tlLean, done: ratio >= 0.7, target: freedomNumber * 0.7 },
      { label: copy.tlFI, done: ratio >= 1.0, target: freedomNumber },
      { label: 'Reached 1.5× your freedom number', done: ratio >= 1.5, target: freedomNumber * 1.5 }
    ];
    const nextTlIdx = timeline.findIndex(t => !t.done);
    document.getElementById('timeline').innerHTML = timeline.map((t, i) => {
      const isNext = i === nextTlIdx;
      const remaining = isNext ? Math.max(0, t.target - savings) : 0;
      return `
      <div class="tl-item ${t.done?'done':''} ${isNext?'next':''}">
        <div class="tl-dot"></div>
        <div class="tl-label">${t.label}</div>
        ${isNext && remaining > 0 ? `<div class="tl-distance">${fmtM(remaining)} to go</div>` : ''}
      </div>`;
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', async function() {
    const token = getToken();
    const userId = getUserId();
    if (!token || !userId) { window.location.href = 'auth.html'; return; }
    if (!(await requirePro())) return;   // accounts are part of Pro

    try {
      const res = await fetch(`${WORKER_URL}/db/fp_profiles?id=eq.${userId}`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (res.status === 401 || res.status === 403) { window.location.href = 'auth.html'; return; }
      if (!res.ok) { document.getElementById('loadingState').textContent = "Couldn't load your data — try refreshing."; return; }

      const data = await res.json();
      const p = (Array.isArray(data) && data.length > 0) ? data[0] : null;
      if (!p || !p.freedom_number) {
        document.getElementById('loadingState').innerHTML = `Run your numbers first — everything on this page is built from your profile.<br><br><a href="firepath_pro.html" style="color:var(--fire-orange);">Run my numbers →</a>`;
        return;
      }

      const savings = p.current_savings || 0;
      const freedomNumber = p.freedom_number;

      renderAchievementsAndTimeline(savings, freedomNumber, p.persona);
      renderFinancialDNA(p);

      document.getElementById('loadingState').style.display = 'none';
      document.getElementById('content').style.display = 'block';
      if (typeof FirePathMotion !== 'undefined') FirePathMotion.initReveal();
    } catch(e) {
      console.log('About You load failed', e);
      document.getElementById('loadingState').textContent = "Couldn't load your data — try refreshing.";
    }
  });
</script>
</body>
</html>
